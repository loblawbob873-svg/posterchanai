# =============================================================================
# PosterChanAI — the proxy container's nginx config.
# =============================================================================
# This file was COPIED here on the proxy's first boot and is now yours: the image never
# overwrites it, so your edits and certbot's survive `docker compose up -d` and restarts.
#
#   docker compose exec proxy vi /etc/nginx/conf.d/posterchanai.conf
#   docker compose exec proxy nginx -t && docker compose exec proxy nginx -s reload
#
# It starts out on a SELF-SIGNED certificate for example.com, so HTTPS works immediately but every
# browser warns. To get a real one, point a domain's DNS at this host, make sure ports 80 and 443
# reach it, then:
#
#   docker compose exec proxy certbot --nginx -d your-domain.com
#   docker compose exec proxy nginx -s reload
#
# certbot rewrites the server_name and the two ssl_certificate lines below for you. Renew with
# `docker compose exec proxy certbot renew` (put it in a cron job or systemd timer on the host).
# =============================================================================

# `posterchanai` is a network alias every backend profile answers to (cpu/cuda/rocm/intel/nostr), so
# this one config works whichever one you brought up. In compose a service is reachable by name on
# the shared network — no published ports involved, and none needed.
#
# The upstream is a VARIABLE, resolved per request through Docker's embedded DNS, and that is
# load-bearing. Named in an `upstream` block instead, nginx resolves it once at startup and caches
# the address for the life of the process — which breaks twice: it refuses to START when no backend
# container exists yet (`host not found in upstream`), and when a backend is later recreated
# (`up -d --build`, an image bump) it keeps the dead address and serves 502 forever WITHOUT exiting,
# so no restart policy rescues it. Re-resolving costs a cache lookup and removes both failures.
resolver 127.0.0.11 valid=10s;   # Docker's embedded DNS; fixed address on every user-defined network

# Running the `split` profile? Then :3051 and :3052 live in DIFFERENT containers and this alias is on
# the app's. Point the relay upstream below at the relay service instead: `set $pc_relay relay:3052;`
map $host $pc_app   { default "posterchanai:3051"; }
map $host $pc_relay { default "posterchanai:3052"; }
map $host $pc_office { default "office:9980"; }

# WebSocket upgrade plumbing — the Nostr relay and the app's own sockets both need it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # For `certbot certonly --webroot -w /var/www/certbot`. The `certbot --nginx` command in the
    # header doesn't need it (that plugin handles the challenge itself), but it costs nothing.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # Self-signed until you run certbot, which rewrites these two lines to its own paths.
    ssl_certificate     /etc/letsencrypt/selfsigned/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/selfsigned/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Blossom uploads and generated media. 0 = no limit; if you set a number, keep it >= the
    # Max upload MB in Admin -> Blossom, or uploads die here with a 413 the client can't explain.
    client_max_body_size 0;

    # text/javascript is the one that matters and the one everybody forgets: that is what the app
    # serves .js as (Python's mimetypes, via Starlette StaticFiles), NOT application/javascript. With
    # only the latter listed, this whole block is a no-op on the ~2.9 MB of client JS/CSS that every
    # cold load pulls — and `?v=` cache-busting re-pays it on every deploy. app.js alone is 1.6 MB,
    # 521 KB gzipped. Keep both spellings; /sw.js really is served as application/javascript.
    gzip            on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript text/xml application/javascript
                    application/json application/manifest+json image/svg+xml;

    # ---- Headers: ALL of them here, and no `location` below sets one -------------------------
    #   Host               the relay builds its NIP-11 icon/banner URLs and welcome page from this;
    #                      lose it and it advertises the nginx upstream NAME as a hostname.
    #   X-Forwarded-Proto  how the app knows it's on HTTPS (secure cookies, and the Blossom URLs it
    #                      hands back, which get embedded in the notes users publish).
    #   X-Real-IP          what the relay trusts for the client address. Without it every connection
    #                      is attributed to this container's address on the docker bridge — one IP
    #                      for every visitor.
    # proxy_set_header is an nginx ARRAY directive: a location that sets ONE header inherits NONE of
    # these. That's why Upgrade/Connection are up here too, rather than in the WebSocket locations
    # where they usually go — down there they'd silently take Host and X-Real-IP with them. Safe for
    # ordinary requests: the map above yields `close` when a client didn't ask to upgrade.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ---- NIP-05 (name@example.com) -----------------------------------------------------------
    # Answered by the RELAY, not the app. Names are configured in Admin -> Relay -> NIP-05 identity
    # server, and must be served from the domain people put after the @.
    location = /.well-known/nostr.json {
        proxy_pass http://$pc_relay;
    }

    # ---- The Nostr relay: wss://example.com/relay --------------------------------------------
    # The same URL in a browser returns the relay's welcome page, and with an
    # `Accept: application/nostr+json` header returns the NIP-11 document. The path is passed
    # through unchanged on purpose: the welcome page advertises the exact URL it was reached on.
    location = /relay {
        proxy_pass http://$pc_relay/relay;
        proxy_buffering off;
        proxy_read_timeout 3600s;   # subscriptions are long-lived and mostly idle; a short timeout
        proxy_send_timeout 3600s;   # here looks like a feed that "stops working after a while"
    }

    # ---- Optional built-in CODE office editor -----------------------------------------------
    # Variable upstream resolution means the proxy still starts when the office profile is absent.
    location ^~ /office-code/ {
        # NO REWRITE. The prefix is passed through UNTOUCHED, because CODE is started with
        # `--o:net.service_root=/office-code` and therefore both serves and ADVERTISES every path
        # under it. Stripping it here made cool.html load and then ask for /browser/<hash>/global.js
        # at the site root — a white document frame, four 404s in the console, and nothing in any
        # log, since cool.html itself had been served perfectly.
        proxy_pass http://$pc_office;
        proxy_set_header X-Forwarded-Prefix /office-code;
        # The bundled desktop and Android origins are legitimate WOPI ancestors. CODE only emits
        # the public web host, so replace (do not append to) its policy; multiple CSP headers would
        # intersect and keep blocking the packaged apps.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data: blob: https://www.collaboraoffice.com; font-src 'self'; media-src 'self' blob:; object-src 'self'; connect-src 'self' wss:; frame-src 'self' blob: https://rating.collaboraonline.com; frame-ancestors 'self' app: capacitor: https://localhost" always;
        proxy_buffering off;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }

    # ---- Streaming responses: chat sockets, LLM token streams, live HLS -----------------------
    # These are the only paths that need `proxy_buffering off` and an hour-long timeout, so they get
    # their own blocks rather than the whole server paying for it. Buffering off means nginx forwards
    # each small read straight to the client instead of draining upstream first — right for a token
    # stream, wrong for a 1.6 MB script, where it pins a connection to the app (a SINGLE uvicorn
    # worker) for as long as the slowest client takes to read it.
    location ^~ /api/ {
        proxy_pass http://$pc_app;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /ws/ {
        proxy_pass http://$pc_app;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Everything else: the web client, /static, /blossom, admin ----------------------------
    # Buffered, on nginx's default timeouts. Blossom blobs and generated media ride here: nginx
    # drains the app fast and feeds the slow client itself, which is what you want in front of one
    # worker. Large uploads spool to a temp file first for the same reason.
    location / {
        proxy_pass http://$pc_app;
    }
}

# =============================================================================================
# xdc.example.com — where mini apps (.xdc games, polls, shared editors) run.
# =============================================================================================
# A mini app is code somebody else wrote, running in an iframe. The only thing between it and the
# localStorage/IndexedDB the web client keeps your NOSTR KEY AND SESSION in is the same-origin
# policy — so an app must not run on the instance's own origin, and the client never asks it to: it
# always loads a mini app from `xdc.` + whatever hostname it was itself loaded from (SANDBOX_LABEL
# in static/js/client/webxdc.js). There is nothing to configure, and therefore nothing that can
# drift out of step; there is only this second hostname, or a blank window forever.
#
# TWO THINGS ARE ON YOU, and mini apps do not work until both are done:
#
#   1. DNS:  xdc.your-domain.com  ->  the same place your-domain.com points. A CNAME is fine;
#            proxied through Cloudflare is fine (this is ordinary HTTPS on 443).
#   2. TLS:  docker compose exec proxy certbot --nginx -d xdc.your-domain.com
#            docker compose exec proxy nginx -s reload
#
#            A certificate of its OWN — certbot rewrites the two ssl_certificate lines in THIS
#            block and leaves the main one alone. Do not use `--expand` to bolt the name onto the
#            instance's certificate: that rewrites the production certificate for a game feature,
#            so a failed issuance takes the whole instance off TLS.
#
# Until step 2, this block serves the same self-signed certificate as the main one (its SAN covers
# xdc.<domain> from first boot) — so mini apps work behind the browser warning while you are still
# setting up, and NOT AT ALL over plain http://, because a service worker needs a secure context.
#
# Only two paths are proxied, and both are served by the APP (host-gated in app/main.py): the
# sandbox loader and the sandbox's service worker. The app's own bytes never reach this server —
# the client downloads the .xdc, unzips it in the browser, and answers the worker over postMessage.
# Having nothing here to fetch is what makes the webxdc spec's one hard rule ("no network access")
# true by construction. Nothing else is exposed: this is not a second front door to the instance.
# Full reasoning, and two designs that were tried and measured first: docs/WEBXDC.md.
# =============================================================================================
server {
    listen 80;
    listen [::]:80;
    server_name xdc.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xdc.example.com;

    ssl_certificate     /etc/letsencrypt/selfsigned/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/selfsigned/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 1M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # NB: Service-Worker-Allowed is set by the APP, not here. Set in both places the header is sent
    # TWICE, fetch combines duplicates into "/, /", and that is not a valid scope prefix: Chromium
    # ignores it (the script is at the root, so "/" is already its maximum scope) and FIREFOX
    # REFUSES THE REGISTRATION with `SecurityError: The operation is insecure` — which reads as
    # "Firefox does not allow service workers here" and is not that at all. Do not add it back.
    location = /sw.js {
        proxy_pass http://$pc_app;
        add_header Cache-Control "no-store" always;
    }

    location /__sandbox__ {
        proxy_pass http://$pc_app;
        add_header Cache-Control "no-store" always;
    }

    # Everything else here belongs to the APP, and its service worker answers it out of the archive
    # the client unzipped. A request only reaches nginx while that worker is not yet CONTROLLING the
    # page — a real race (the loader registers it, it activates and claims, the app frame can
    # navigate in between). Chromium claims fast enough to hide it; Firefox does not, and the reader
    # got a 404 page inside the game window. So the miss reloads itself ONCE; the `?r` guard is what
    # stops a worker that never arrives from becoming a reload loop, and says so instead.
    location / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>starting…</title><style>html,body{margin:0;height:100%;background:#000;color:#888;font:13px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}</style><div id=m>starting…</div><script>if(!location.search.includes("r=1")){location.replace(location.pathname+"?r=1"+location.hash);}else{document.getElementById("m").textContent="The app could not start: its service worker never took control of this page. Close the app and open it again.";}</script>';
    }
}

# Want git-over-nostr (POSTERCHANAI_GIT=1) served over TLS, or the relay on its own hostname
# (wss://relay.example.com/)? Both are written out, with the reasoning, in the repo's
# nginx/posterchanai.conf.example — copy the block you want in here. (Use `$pc_app` / `$pc_relay`
# for their upstreams rather than the template's 127.0.0.1, which in here would mean nginx itself.)
