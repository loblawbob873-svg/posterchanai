# PosterChanAI's bundled SearXNG — ONE settings file for both install paths:
#
#   * host install  — scripts/install/searxng.sh copies this to searxng/settings.yml (once), fills in
#                     a generated secret and the outgoing-proxy line; the unit points at it.
#   * docker        — COPYed to /etc/searxng/settings.yml in the image and pointed at by
#                     SEARXNG_SETTINGS_PATH. There is no `searxng` container any more: the app image
#                     runs SearXNG in-process (app/services/searxng_native.py).
#
# The path lives in this directory, and not somewhere less container-shaped, because it is still the
# file the IMAGE bakes and because moving it would mean two copies during the transition — which is
# the one thing a settings file this load-bearing must not have.
#
# It is a FILE and not a set of environment variables because SearXNG maps exactly ONE setting to an
# env var (`secret_key` ← SEARXNG_SECRET, searx/settings_defaults.py). `SEARXNG_SEARCH_FORMATS` and
# friends do nothing — verified by reading the source, after a first version of this shipped relying
# on them, which would have left the JSON API off (i.e. every search 403ing) on every container
# install while the app happily selected the instance.
use_default_settings: true

general:
  instance_name: "PosterChan Search"
  # This instance is not a public one — it exists for this node's own app. Nothing to donate to and
  # no issue tracker of ours to point at.
  donation_url: false
  enable_metrics: false

server:
  # Replaced by the installer on a host install, and by docker-entrypoint.sh in a container. It signs
  # preference cookies for an instance that only this node talks to — but a value COMMITTED here
  # would be a known key on every deployment, which is why it is an obvious placeholder and why both
  # install paths overwrite it.
  secret_key: "ultrasecretkey"
  # NO bind_address here, and it would not be read if there were one: nothing serves this file's
  # SearXNG from SearXNG's own server any more. The unit runs uvicorn bound to 127.0.0.1 and the app
  # mounts the WSGI app at /searxng, so the bind address is the app's. That is the fix for a real
  # bug rather than a tidy-up — the container this replaced read its bind address from GRANIAN_HOST
  # while ignoring BOTH `server.bind_address` and SEARXNG_BIND_ADDRESS, and the first version of it
  # listened on `*:8899`: an unauthenticated, limiter-disabled metasearch instance on every
  # interface of the box.
  # OFF deliberately: the only client is this node's app. The limiter is exactly what makes PUBLIC
  # instances answer a server with 429, which is the problem a bundled instance exists to solve.
  limiter: false
  image_proxy: true

search:
  # THE load-bearing line. SearXNG ships JSON OFF, and with it off every search this app makes gets a
  # 403 with an HTML body — which every caller (AI web lookups, news digests, the bots, the Web
  # Search screen) reads as "no results" rather than as a misconfiguration.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: "duckduckgo"

ui:
  # Dark, to match the client it serves. `simple_style: auto` would follow the *viewer's* OS, which
  # for an operator glancing at this instance is a coin flip.
  default_theme: simple
  theme_args:
    simple_style: dark
  center_alignment: true

# @PC_OUTGOING@ — the installer replaces this marker with the `outgoing.proxies` block pointing at
# this node's HTTP proxy (Tor1 → Tor2 → direct). Left as a comment when there is no proxy to use, and
# on compose, where the app's proxy lives inside a different container's network namespace.
