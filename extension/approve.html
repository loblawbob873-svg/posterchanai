<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="popup.css">
<style>
  /* The cyberpunk layer comes from popup.css; this is only what is particular to an approval. */
  body{ width:auto; min-height:0; padding:16px; }
  h1{ font-size:14px; margin:0 0 6px; font-family:var(--cp-mono); text-transform:uppercase; letter-spacing:.08em;
      background:linear-gradient(90deg,var(--cp-cyan),var(--cp-pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .origin{ font-family:var(--cp-mono); font-size:13px; word-break:break-all; color:var(--cp-cyan);
           text-shadow:0 0 10px rgba(60,232,255,.35); margin-bottom:12px; }
  .what{ position:relative; padding:10px 12px 10px 14px; border-radius:6px; border:1px solid var(--cp-line);
         background:var(--cp-panel); margin-bottom:10px; }
  .what::before{ content:""; position:absolute; left:0; top:8px; bottom:8px; width:2px; border-radius:2px;
                 background:linear-gradient(var(--cp-cyan),var(--cp-pink)); }
  .kind{ font-weight:600; color:#fff; }
  pre{ margin:8px 0 0; padding:8px; border-radius:6px; background:rgba(0,0,0,.45); border:1px solid var(--cp-line);
       font-family:var(--cp-mono); font-size:11.5px; color:var(--cp-green); white-space:pre-wrap; word-break:break-word;
       max-height:140px; overflow:auto; }
  .warn{ color:var(--cp-amber); font-size:12px; margin-bottom:10px; }
  label.remember{ display:flex; align-items:center; gap:7px; margin:10px 0; font-size:13px; color:var(--cp-dim); }
  .row{ display:flex; gap:8px; }
  .row button{ flex:1 1 0; min-height:42px; border-radius:6px; cursor:pointer; font:inherit; font-family:var(--cp-mono);
               text-transform:uppercase; letter-spacing:.08em; font-size:12.5px; color:var(--cp-text);
               border:1px solid var(--cp-line); background:rgba(60,232,255,.06); transition:box-shadow .15s, border-color .15s; }
  #allow{ border:1px solid transparent; font-weight:700; color:#fff;
          background:linear-gradient(var(--cp-bg2),var(--cp-bg2)) padding-box, linear-gradient(90deg,var(--cp-cyan),var(--cp-pink)) border-box;
          box-shadow:0 0 16px rgba(60,232,255,.2); }
  #allow:hover{ box-shadow:var(--cp-glow), 0 0 22px rgba(255,92,240,.28); }
  #deny{ color:var(--cp-red); border-color:rgba(255,77,125,.4); }
  #deny:hover{ background:rgba(255,77,125,.1); box-shadow:0 0 12px rgba(255,77,125,.25); }
</style>
</head>
<body>
  <h1>A site wants to use your Nostr key</h1>
  <div class="origin" id="origin">…</div>
  <div class="what" id="what"></div>
  <div class="warn" id="warn"></div>
  <label class="remember"><input type="checkbox" id="remember" checked>
    Remember this answer for this site</label>
  <div class="row">
    <button id="deny">Deny</button>
    <button id="allow">Allow</button>
  </div>
<script src="approve.js"></script>
</body>
</html>
