<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <b>PosterChan</b>
  <span id="status" class="muted"></span>
  <button id="tab-gen" class="tab" title="Password generator">Generate</button>
</header>

<!-- Not paired -->
<section id="pane-pair" class="pane hidden">
  <p class="muted">
    Open <b>PosterChan → Passwords → Pair a device</b>, choose read-only or full access, and paste the
    code here. It carries the key that decrypts your passwords — don't send it over chat.
  </p>
  <textarea id="pair-code" rows="4" placeholder="paste the pairing code"></textarea>
  <button id="pair-go" class="primary">Pair</button>
  <div id="pair-err" class="err"></div>
</section>

<!-- Logins -->
<section id="pane-list" class="pane hidden">
  <input id="q" type="search" placeholder="Search…" autocomplete="off">
  <div id="list"></div>
</section>

<!-- Generator -->
<section id="pane-gen" class="pane hidden">
  <div class="genout"><code id="gen-out"></code><button id="gen-again" title="Again">↻</button></div>
  <div id="gen-bits" class="muted small"></div>
  <label class="lbl">Length <b id="gen-len">20</b></label>
  <input id="gen-range" type="range" min="8" max="64" value="20">
  <div class="opts">
    <label><input type="checkbox" id="g-lower" checked> a-z</label>
    <label><input type="checkbox" id="g-upper" checked> A-Z</label>
    <label><input type="checkbox" id="g-digits" checked> 0-9</label>
    <label><input type="checkbox" id="g-symbols" checked> !@#$</label>
    <label><input type="checkbox" id="g-amb"> no 1lI0O</label>
  </div>
  <div class="row">
    <button id="gen-copy" class="primary">Copy</button>
    <button id="gen-fill">Fill this page</button>
  </div>
</section>

<!-- Bookmark sync. OFF until asked for, because turning it on writes into the browser's bookmark
     tree, and a sync nobody chose is the one that surprises somebody. The line under it says which
     direction it can go: a read-only pairing has no signing key, so it can receive and not send. -->
<!-- Editing an entry. Reuses the SAVE path (merge, publish or queue) rather than a second writer,
     so a read-only pairing queues an edit exactly as it queues a new login. -->
<section id="pane-edit" class="pane hidden">
  <label class="fld">Title<input class="input" id="ed-title" autocomplete="off"></label>
  <label class="fld">Username<input class="input" id="ed-user" autocomplete="off" spellcheck="false"></label>
  <label class="fld">Password
    <span class="input-row" style="display:flex;gap:6px">
      <input class="input" id="ed-pass" type="password" autocomplete="off" spellcheck="false">
      <button id="ed-show" type="button">show</button>
    </span></label>
  <label class="fld">Website<input class="input" id="ed-url" autocomplete="off" spellcheck="false"
    placeholder="https://example.com"></label>
  <label class="fld">One-time code secret <span class="muted small">— otpauth:// or the raw secret</span>
    <input class="input" id="ed-totp" autocomplete="off" spellcheck="false"></label>
  <label class="fld">Notes<textarea class="input" id="ed-notes" rows="3"></textarea></label>
  <div id="ed-note" class="muted small"></div>
  <div class="row" style="gap:8px">
    <button id="ed-save" class="primary">Save changes</button>
    <button id="ed-cancel">Cancel</button>
  </div>
</section>

<section id="pane-bm" class="pane hidden">
  <label class="row"><input type="checkbox" id="bm-on"> <b>Sync bookmarks</b></label>
  <div id="bm-note" class="muted small"></div>
  <button id="bm-sync">Merge now</button>
  <button id="bm-tidy">Tidy duplicates</button>
</section>

<!-- Relays. The pairing code carries whatever the app had; this overrides it, because a code that
     carried an unreachable relay (or none) is otherwise a dead end that only a re-pair can fix, and
     it looks exactly like "sync does nothing". Empty = use the pairing code's, falling back to
     PosterChan's own relay. -->
<section id="pane-relays" class="pane hidden">
  <div class="muted small">One per line. Leave empty to use whatever the app paired with.</div>
  <textarea id="relay-list" rows="4" spellcheck="false" autocapitalize="none"></textarea>
  <div id="relay-note" class="muted small"></div>
  <button id="relay-save">Save relays</button>
</section>

<section id="pane-sites" class="pane hidden">
  <div class="muted small" style="margin-bottom:8px">Sites you let use your Nostr key.</div>
  <div id="sites"></div>
</section>

<footer class="bot">
  <span id="ver" class="muted small"></span>
  <button id="sites-tab">Sites</button>
  <button id="bm-tab">Bookmarks</button>
  <button id="relay-tab">Relays</button>
  <button id="sync">Sync</button>
  <button id="unpair" class="danger">Unpair</button>
</footer>

<script src="vaultcore.js"></script>
<script src="popup.js"></script>
</body>
</html>
