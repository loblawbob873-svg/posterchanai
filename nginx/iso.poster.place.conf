# iso.poster.place — PosterChanOS live images, served from nas.lan's distfiles export
# (/raid/distfiles/distfiles/iso, NFS-mounted here at /var/lib/distfiles/iso). Replaces the VPS at
# 198.55.116.7, deleted 2026-09-21. Published by scripts/publish_iso.sh (uploads to .uploading,
# verifies sha256, renames atomically — the old image serves until the new one is whole).
server {
    listen 80;
    server_name iso.poster.place;
    root /var/lib/distfiles/iso;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { autoindex on; try_files $uri $uri/ =404; }
    location ~ \.iso$ { add_header Content-Disposition 'attachment'; add_header Accept-Ranges bytes; }
}

server {
    listen 443 ssl;
    server_name iso.poster.place;
    ssl_certificate /etc/letsencrypt/live/iso.poster.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iso.poster.place/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/lib/distfiles/iso;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { autoindex on; try_files $uri $uri/ =404; }
    location ~ \.iso$ { add_header Content-Disposition 'attachment'; add_header Accept-Ranges bytes; }
}
