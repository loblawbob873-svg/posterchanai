name: Android emulator checks

# THE THING THAT SHOULD HAVE EXISTED BEFORE ANY OF THIS WAS WRITTEN.
#
# Everything native in this app has been guarded by matching TEXT in a Java source, because there is
# no device in the loop: the dev box has no KVM (its firmware has SVM switched off) and the Gradle
# daemon will not stay up on it. That is how three background-sync bugs shipped in one day through a
# fully green test suite — every string the tests looked for was present and the LOGIC around it was
# wrong, and each round cost an APK build and a person's evening to discover.
#
# GitHub's Linux runners have KVM. So the emulator lives here: a real Android system, booted, with the
# real APK installed, driven by adb, with logcat captured. It can do the three things no amount of
# static checking can:
#
#   * CRASH. Install, launch, exercise, and fail the job on a FATAL EXCEPTION with the stack trace in
#     the log — instead of a user reporting "it keeps crashing" and me guessing at causes.
#   * DOZE. `dumpsys deviceidle force-idle` puts the system into real Doze, which is the exact state
#     background sync exists for and the one state that cannot be simulated in a unit test. The
#     "unreadable network reads as offline" bug lived precisely here.
#   * THE LIFECYCLE. Screen off, app backgrounded, process frozen — driven for real, not mocked.
#
# It runs on the same triggers as the APK build, plus workflow_dispatch so it can be pointed at a
# branch while a fix is being written rather than after it ships.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - 'scripts/client_shell.py'
      - 'templates/client.html'
      - 'static/js/client/**'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - 'scripts/client_shell.py'
      - 'templates/client.html'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level to boot'
        required: false
        default: '34'

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # KVM is present on these runners but not world-accessible by default; the emulator needs it,
      # and without it the boot takes tens of minutes and then times out. This udev rule is the
      # documented fix and is what makes the whole job viable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm ci

      - name: Build web bundle (www)
        working-directory: mobile
        env:
          PC_APP_BUILD: ${{ github.run_number }}
        run: bash build-www.sh

      - name: Test bundled Concord composer repaint safety
        working-directory: mobile
        run: |
          test -s www/static/js/client/concord-cache.js
          node --check www/static/js/client/concord-cache.js
          node ../tests/client/concord_runtime.mjs www/static/js/client/concord.js
          # DM startup/cache ordering, shared phone pressure and retries must pass on the bundle.
          node ../tests/client/dm_delivery_runtime.mjs www/static/js/client/app.js
          node ../tests/client/dm_retry_runtime.mjs www/static/js/client/app.js
          node ../tests/client/extension_interactive_priority_runtime.mjs www/static/js/client/app.js
          node ../tests/client/vault_background_sync_runtime.mjs www/static/js/client/vault.js
          node ../tests/client/concord_social_emoji_runtime.mjs www/static/js/client/app.js
          node ../tests/client/terminal_partial_replay_runtime.mjs www/static/js/client/term.js
          node ../tests/client/terminal_hosts_runtime.mjs www/static/js/client/term.js

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      # DEBUG, not release: it needs no signing secret, installs over adb, and is the same Java.
      - name: Build debug APK
        id: debug-build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
          # Do not leave Gradle's 1.5 GB daemon resident beside the emulator. Run 33847584540 ended
          # with the emulator silently disappearing while Android itself was healthy, after the
          # action had auto-expanded the AVD to 2560 MB and the cached build daemon stayed alive.
          ./gradlew --stop

      - name: Verify APK web-asset provenance
        run: |
          APK=$(find mobile/android -path '*debug*' -name '*.apk' ! -name '*androidTest*' | head -1)
          test -n "$APK"
          python3 scripts/check_android_apk_assets.py "$APK" "$PWD"

      # Use the supported SwiftShader GLES path. Vulkan snapshots are unsupported and the
      # deprecated indirect renderer repeatedly lost the emulator process during web UI checks.
      # https://developer.android.com/studio/run/emulator-troubleshooting
      # https://developer.android.com/studio/run/emulator-acceleration
      # Cache identity includes graphics settings so no old AVD shape is restored.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Versioned by the complete virtual-hardware/snapshot shape. The old `avd-34` snapshot
          # was created before RAM was specified (emulator chose 2560 MB) and later restored after
          # config.ini was changed to 1536 MB. QEMU twice vanished silently after that mixed restore.
          key: avd-gles-swangle-1536-v3-${{ github.event.inputs.api_level || '34' }}

      - name: Preserve emulator child exit evidence
        run: |
          mv "$ANDROID_HOME/emulator/emulator" "$ANDROID_HOME/emulator/emulator.pc-real"
          cp scripts/android_emulator_supervisor.sh "$ANDROID_HOME/emulator/emulator"
          chmod +x "$ANDROID_HOME/emulator/emulator"

      # The action can continue after a failed prelaunch hook. Repeat the same preflight in
      # each mandatory verdict command so a guard failure cannot become a green device status.
      # Run native regressions before the separate lifecycle boot can lose its emulator.
      # Both cold boots remain mandatory; this does not convert lifecycle failure to a pass.
      - name: Run instrumented checks on a fresh emulator
        id: instrumented
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          force-avd-creation: false
          pre-emulator-launch-script: bash scripts/android_emulator_preflight.sh
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -stdouterr-file /tmp/pc-emulator-console.txt
          disable-animations: true
          script: |
            bash scripts/android_emulator_preflight.sh && timeout --kill-after=30s 25m bash scripts/android_instrumented.sh; b=$?; echo "$b" > /tmp/pc-instrumented-status; exit "$b"

      - name: Preserve first boot and stop the instrumentation build daemon
        if: always() && steps.debug-build.outcome == 'success'
        run: |
          cp /tmp/pc-emulator-console.txt /tmp/pc-emulator-instrumented-console.txt || true
          cd mobile/android
          timeout --kill-after=5s 30s ./gradlew --stop || true

      # Run34285025052 completed all112 native cases, then the separate lifecycle emulator
      # SIGSEGV'd after screen-off (ColorBuffer62). Change only this boot's supported GLES
      # backend to SwiftShader+ANGLE; keep the same emulator build and every device assertion.
      # https://developer.android.com/studio/run/emulator-acceleration#accel-graphics
      - name: Run the device checks
        if: always() && steps.debug-build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          force-avd-creation: false
          # Do not restore mutable Quick Boot state for the verdict run. The cache saves image
          # download/AVD creation time; -wipe-data + -no-snapshot gives every test run one coherent
          # cold boot, independent of the emulator revision setup-android installed today.
          # Linux emulator supports direct stdout/stderr capture but requires an existing file.
          # Keep QEMU's final message even after the action's background-shell pipe is closed.
          pre-emulator-launch-script: bash scripts/android_emulator_preflight.sh
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -camera-back none -stdouterr-file /tmp/pc-emulator-console.txt
          disable-animations: true
          # Separate fresh boot: no test state or dead transport inherited from instrumentation.
          script: |
            bash scripts/android_emulator_preflight.sh && timeout --kill-after=30s 15m bash scripts/android_device_checks.sh; a=$?; echo "$a" > /tmp/pc-device-status; exit "$a"

      - name: Require both real device verdicts
        if: always()
        run: |
          a=$(cat /tmp/pc-device-status 2>/dev/null || echo 125)
          b=$(cat /tmp/pc-instrumented-status 2>/dev/null || echo 125)
          echo "device=$a instrumented=$b"; case "$a:$b" in 0:0) exit 0;; 0:2|2:0|2:2) echo "::error title=Device checks DID NOT RUN::the emulator never ran them; this build is NOT evidence that the app works on a device"; exit 1;; *) exit 1;; esac

      # Keep evidence if the emulator process disappears without an Android crash report.
      - name: Capture emulator host diagnostics
        if: always()
        run: |
          free -m > /tmp/pc-emulator-host.txt
          ps -eo comm,rss --sort=-rss | head -20 >> /tmp/pc-emulator-host.txt
          sudo dmesg -T | tail -100 >> /tmp/pc-emulator-host.txt || true

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: |
            /tmp/pc-emulator-host.txt
            /tmp/pc-emulator-supervisor.txt
            /tmp/pc-emulator-instrumented-console.txt
            /tmp/pc-emulator-console.txt
            /tmp/pc-logcat*.txt
            /tmp/pc-device-*.txt
            /tmp/android-runner/emu-crash*
          if-no-files-found: ignore

      # SCREENSHOTS OF THE NATIVE SCREENS. The launcher, the messages app and the dialer are drawn by
      # Android rather than by the WebView, so none of the browser-driven checks in this repo can see
      # them and nobody on the build side has a device to look at. "Make it look good" is a real
      # requirement and this is the only way to judge it from the actual pixels.
      # THE INSTRUMENTED TEST REPORT. Per-test failures are legible nowhere else — a red
      # `connectedDebugAndroidTest` says only "there were failing tests".
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report
          path: /tmp/pc-androidtest
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: /tmp/pc-shot-*.png
          if-no-files-found: ignore
