name: Android emulator checks

# THE THING THAT SHOULD HAVE EXISTED BEFORE ANY OF THIS WAS WRITTEN.
#
# Everything native in this app has been guarded by matching TEXT in a Java source, because there is
# no device in the loop: the dev box has no KVM (its firmware has SVM switched off) and the Gradle
# daemon will not stay up on it. That is how three background-sync bugs shipped in one day through a
# fully green test suite — every string the tests looked for was present and the LOGIC around it was
# wrong, and each round cost an APK build and a person's evening to discover.
#
# GitHub's Linux runners have KVM. So the emulator lives here: a real Android system, booted, with the
# real APK installed, driven by adb, with logcat captured. It can do the three things no amount of
# static checking can:
#
#   * CRASH. Install, launch, exercise, and fail the job on a FATAL EXCEPTION with the stack trace in
#     the log — instead of a user reporting "it keeps crashing" and me guessing at causes.
#   * DOZE. `dumpsys deviceidle force-idle` puts the system into real Doze, which is the exact state
#     background sync exists for and the one state that cannot be simulated in a unit test. The
#     "unreadable network reads as offline" bug lived precisely here.
#   * THE LIFECYCLE. Screen off, app backgrounded, process frozen — driven for real, not mocked.
#
# It runs on the same triggers as the APK build, plus workflow_dispatch so it can be pointed at a
# branch while a fix is being written rather than after it ships.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - 'static/js/client/**'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level to boot'
        required: false
        default: '34'

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # KVM is present on these runners but not world-accessible by default; the emulator needs it,
      # and without it the boot takes tens of minutes and then times out. This udev rule is the
      # documented fix and is what makes the whole job viable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm ci

      - name: Build web bundle (www)
        working-directory: mobile
        env:
          PC_APP_BUILD: ${{ github.run_number }}
        run: bash build-www.sh

      - name: Test bundled Concord composer repaint safety
        working-directory: mobile
        run: |
          test -s www/static/js/client/concord-cache.js
          node --check www/static/js/client/concord-cache.js
          node ../tests/client/concord_runtime.mjs www/static/js/client/concord.js
          # DM startup/cache ordering, shared phone pressure and retries must pass on the bundle.
          node ../tests/client/dm_delivery_runtime.mjs www/static/js/client/app.js
          node ../tests/client/dm_retry_runtime.mjs www/static/js/client/app.js
          node ../tests/client/extension_interactive_priority_runtime.mjs www/static/js/client/app.js
          node ../tests/client/vault_background_sync_runtime.mjs www/static/js/client/vault.js
          node ../tests/client/concord_social_emoji_runtime.mjs www/static/js/client/app.js
          node ../tests/client/terminal_hosts_runtime.mjs www/static/js/client/term.js

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      # DEBUG, not release: it needs no signing secret, installs over adb, and is the same Java.
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
          # Do not leave Gradle's 1.5 GB daemon resident beside the emulator. Run 33847584540 ended
          # with the emulator silently disappearing while Android itself was healthy, after the
          # action had auto-expanded the AVD to 2560 MB and the cached build daemon stayed alive.
          ./gradlew --stop

      - name: Verify APK web-asset provenance
        run: |
          APK=$(find mobile/android -path '*debug*' -name '*.apk' ! -name '*androidTest*' | head -1)
          test -n "$APK"
          python3 scripts/check_android_apk_assets.py "$APK" "$PWD"

      # Cached so the AVD snapshot is not rebuilt on every run — a cold boot is most of the wall clock.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Versioned by the complete virtual-hardware/snapshot shape. The old `avd-34` snapshot
          # was created before RAM was specified (emulator chose 2560 MB) and later restored after
          # config.ini was changed to 1536 MB. QEMU twice vanished silently after that mixed restore.
          key: avd-clean-1536-v1-${{ github.event.inputs.api_level || '34' }}

      - name: Create AVD and snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Run the device checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          force-avd-creation: false
          # Do not restore mutable Quick Boot state for the verdict run. The cache saves image
          # download/AVD creation time; -wipe-data + -no-snapshot gives every test run one coherent
          # cold boot, independent of the emulator revision setup-android installed today.
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # TWO KINDS OF CHECK ON ONE BOOT, because booting the AVD is most of the wall clock.
          #
          # `android_device_checks.sh` drives the LIFECYCLE — install, launch, home, screen off, real
          # Doze via `dumpsys deviceidle force-idle`, wake — and fails on a crash, an ANR or a
          # foreground-service violation. Nothing else in this repo can see any of that.
          #
          # `connectedDebugAndroidTest` runs INSTRUMENTED tests, which is what a launcher, an SMS
          # app and a dialer need: those live behind system roles and providers (`RoleManager`,
          # `Telephony.Sms`, `CallLog`, `InCallService`) that do not exist off a device, so a javac
          # test cannot reach them and a text-matching test proves nothing about them.
          #
          # SKIPPED, LOUDLY, WHEN THERE ARE NONE. A gradle task with no sources exits 0, which is
          # indistinguishable from a green run — and this repo has already shipped a whole rewrite
          # behind a test file that could not compile. If there are no androidTest sources the step
          # says so as a run annotation instead of printing a tick.
          # ONE `bash` INVOCATION, and that is not style. The runner hands this block to `sh`, and
          # `sh` on this image is dash — which parsed the multi-line `if … fi` that used to be here
          # as `Syntax error: end of file unexpected`, failed the step, and MEANT THE INSTRUMENTED
          # TESTS NEVER RAN ONCE. Every emulator run since they were written was red for that reason
          # and green on everything it did manage to do, which is the worst possible combination:
          # the job that exists to catch what static checks cannot was itself never running.
          # BOTH RUN, ALWAYS, and the step fails if either did. Chained with `&&` the instrumented
          # tests were skipped whenever a lifecycle check failed — which is exactly when their answer
          # is most wanted, and it kept them from running a second time after the `sh` fix.
          # Bound each half independently. A wedged adb/Gradle/instrumentation command used to sit
          # inside this opaque combined step until the job-wide 60-minute timeout, at which point
          # the artifact-upload steps had no useful report to publish. These limits are several
          # times the normal duration. Each command gets its own process group plus a hard KILL
          # grace period: a foreground timeout can signal the emulator owned by this action, while
          # TERM alone is insufficient when adb has printed "Complete" but kept its socket open.
          # Crucially, the second half runs even when the first times out, and the always() uploads
          # below retain whichever diagnostics were produced.
          script: |
            timeout --kill-after=30s 15m bash scripts/android_device_checks.sh; a=$?; timeout --kill-after=30s 25m bash scripts/android_instrumented.sh; b=$?; echo "device=$a instrumented=$b"; case "$a:$b" in 0:0) exit 0;; 0:2|2:0|2:2) echo "::warning title=Device checks DID NOT RUN::the emulator never ran them; this build is NOT evidence that the app works on a device"; exit 0;; *) exit 1;; esac

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: |
            /tmp/pc-logcat*.txt
            /tmp/pc-device-*.txt
          if-no-files-found: ignore

      # SCREENSHOTS OF THE NATIVE SCREENS. The launcher, the messages app and the dialer are drawn by
      # Android rather than by the WebView, so none of the browser-driven checks in this repo can see
      # them and nobody on the build side has a device to look at. "Make it look good" is a real
      # requirement and this is the only way to judge it from the actual pixels.
      # THE INSTRUMENTED TEST REPORT. Per-test failures are legible nowhere else — a red
      # `connectedDebugAndroidTest` says only "there were failing tests".
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report
          path: /tmp/pc-androidtest
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: /tmp/pc-shot-*.png
          if-no-files-found: ignore
