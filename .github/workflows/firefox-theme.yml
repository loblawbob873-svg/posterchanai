name: Firefox theme

# Builds os/firefox-theme into an .xpi, PUBLISHES it on addons.mozilla.org as a listed (public)
# theme via os/firefox-theme/amo.py, and once Mozilla's review has signed it, publishes the signed
# file as release firefox-theme-v<version>. (1.0.0 was unlisted — signed, but with no store page.)
#
# WHY SIGNING IS THE WHOLE JOB. PosterChanOS ships release Firefox (www-client/firefox-bin), and
# MEASURED on the laptop it discards an unsigned theme without a word — installed through a profile's
# extensions/ directory, through distribution/extensions/ or through the enterprise policy the OS
# uses, there is no entry in extensions.json and nothing in any log. `xpinstall.signatures.required`
# is ignored on release builds. So the unsigned build this repository can make on its own is useful
# for testing (about:debugging → Load Temporary Add-on) and useless to ship;
# scripts/publish_overlay.sh fetches THIS workflow's signed asset and refuses anything else.
#
# Uses the same AMO credentials as the password extension (extension.yml). Skipped — not failed —
# when they are absent, as in a fork. A new signed build needs a new `version` in manifest.json: AMO
# refuses a version it has already signed, and the overlay keys the policy install on the file name.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'os/firefox-theme/**'
      - '.github/workflows/firefox-theme.yml'
  workflow_dispatch:
  # A LISTED version is signed only after Mozilla's review. amo.py is resumable, so this picks the
  # signed file up whenever review finishes, without anyone re-running the job by hand.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (and prove the palette is still readable)
        id: build
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest pillow
          python3 -m pytest -q --noconftest -o addopts= tests/test_firefox_theme.py
          xpi=$(python3 os/firefox-theme/build.py)
          ver=$(python3 -c "import json;print(json.load(open('os/firefox-theme/manifest.json'))['version'])")
          echo "xpi=$xpi" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$xpi")" >> "$GITHUB_OUTPUT"

      # Signing is keyed on the RELEASE, not on a diff: a version that already has a signed asset is
      # done, and re-submitting it is AMO's "version already exists" error after the upload.
      - name: Already signed?
        id: have
        run: |
          if gh release view "firefox-theme-v${{ steps.build.outputs.ver }}" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "${{ steps.build.outputs.name }}"; then
            echo "signed=yes" >> "$GITHUB_OUTPUT"
            echo "::notice title=Firefox theme::v${{ steps.build.outputs.ver }} is already signed and published"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish on addons.mozilla.org (public listing) and fetch the signed file
        id: amo
        if: steps.have.outputs.signed == 'no' && env.AMO_JWT_ISSUER != ''
        run: |
          set +e
          # Submit the SAME BYTES that were built and tested. Exit 3 = awaiting Mozilla's review.
          # The channel per version lives beside the theme: unlisted = signed within minutes (what
          # PosterChanOS ships), listed = the public page, signed only after a human review.
          ch=$(tr -d '[:space:]' < os/firefox-theme/amo-channel 2>/dev/null || echo listed)
          python3 os/firefox-theme/amo.py --xpi "${{ steps.build.outputs.xpi }}" \
            --out "/tmp/${{ steps.build.outputs.name }}" --timeout 2400 --channel "${ch:-listed}"
          rc=$?
          if [ $rc -eq 3 ]; then
            echo "::notice title=Firefox theme::v${{ steps.build.outputs.ver }} is awaiting Mozilla's review; the scheduled run will publish it once approved"
            echo "ready=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ $rc -eq 0 ] || exit $rc
          python3 os/firefox-theme/build.py --signed "/tmp/${{ steps.build.outputs.name }}" \
            || { echo "::error title=Firefox theme::AMO returned a file with no signature"; exit 1; }
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - name: Publish the signed theme
        if: steps.have.outputs.signed == 'no' && env.AMO_JWT_ISSUER != '' && steps.amo.outputs.ready == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firefox-theme-v${{ steps.build.outputs.ver }}
          name: PosterChan Cyberpunk — Firefox theme ${{ steps.build.outputs.ver }} (signed)
          body: |
            The PosterChanOS Firefox theme, published on addons.mozilla.org (public listing) and signed by Mozilla. PosterChanOS installs it
            through /etc/firefox/policies/policies.json; on any other system open this .xpi in Firefox.
          files: /tmp/${{ steps.build.outputs.name }}

      # ONE theme release, not one per version. Each version used to stay behind as its own release,
      # so the Releases page listed three "PosterChan Cyberpunk" themes side by side. Nothing reads an
      # old one — publish_overlay.sh fetches exactly the current version and copies it into the image
      # — so once the new version is PUBLISHED (never before: until then the old one is the only
      # signed copy there is) every other firefox-theme-v* release and its tag go.
      - name: Retire older theme releases
        if: steps.have.outputs.signed == 'no' && env.AMO_JWT_ISSUER != '' && steps.amo.outputs.ready == 'yes'
        run: |
          keep="firefox-theme-v${{ steps.build.outputs.ver }}"
          gh release view "$keep" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::$keep is not published; keeping the old ones"; exit 1; }
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^firefox-theme-v' | grep -vx "$keep" \
            | while read -r t; do gh release delete "$t" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" && echo "retired $t"; done

      - name: No credentials
        if: steps.have.outputs.signed == 'no' && env.AMO_JWT_ISSUER == ''
        run: echo "::warning title=Firefox theme::AMO credentials are not configured — the theme was built but not signed, so PosterChanOS will not ship it"
