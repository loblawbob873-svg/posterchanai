name: Firefox extension

# Builds the PosterChan Passwords add-on and publishes it to a rolling GitHub Release, so
# poster.place/extension/unpacked and /chrome always have something to hand out. (Bare
# poster.place/extension is the signed AMO listing, which this workflow does not produce.)
#
# It exists because the built artifact is NOT in the repo: extension/dist and extension/vendor are
# generated (vendor/nostr.bundle.js is copied from the app's own vendored bundle, vaultcore.js from
# the client) and committing either would be a second copy to keep in step. That was the right call
# for the tree and the wrong one for the user, who had no way to obtain the thing at all — hence
# this. `about:debugging` still wants an unpacked directory, so both are published: the .zip for
# signing/AMO, and the unpacked bundle as a tarball for a temporary install.
#
# NOT SIGNED here, and that is now a smaller thing than it was: the add-on is listed on AMO
# (https://addons.mozilla.org/firefox/addon/posterchan-passwords/), so the ordinary Firefox install is
# one click from Mozilla and auto-updates. Signing still needs AMO credentials this workflow doesn't
# hold, so a NEW VERSION reaches release Firefox only when someone uploads dist/posterchan-passwords.zip
# to AMO by hand — after bumping manifest.json's `version`, which AMO rejects as a duplicate otherwise.
# What's built here is what a developer sideloads, and what Chrome/Edge/Brave install unpacked.
# See docs/PASSWORDS.md.

on:
  push:
    branches: [ main ]
    paths:
      - 'extension/**'
      - 'static/js/client/vaultcore.js'      # the shared core IS the extension's core
      - 'static/vendor/nostr/nostr.bundle.js'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # AT JOB LEVEL, deliberately. The AMO step needs to SKIP (not fail) when the credentials are
    # absent — forks and PR runs cannot see them — and a step's `if:` has no access to the `secrets`
    # context at all, nor reliably to env defined on that same step. Job-level env is the documented
    # way to make a secret's presence testable in a condition.
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      # Full history: the AMO step decides whether to submit by comparing this commit's manifest
      # version with the one BEFORE the push. The default shallow clone (depth 1) has no such commit,
      # so the comparison would silently read "changed" on every push and submit every time — which
      # AMO answers with "Version N already exists", after the upload, on every ordinary commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow (the icons are generated, not committed)
        run: python3 -m pip install --quiet pillow

      - name: Build
        run: bash extension/build.sh

      # The copy step in build.sh is the anti-drift mechanism; prove it did its job rather than
      # trusting it. A silently stale vaultcore.js in the extension is the exact failure
      # tests/test_vault_extension.py exists to catch, and it is cheap to check again here where the
      # artifact is actually produced.
      - name: The shipped core must match the app's
        run: |
          a=$(sha256sum static/js/client/vaultcore.js | cut -d' ' -f1)
          b=$(sha256sum extension/vaultcore.js       | cut -d' ' -f1)
          echo "app: $a"; echo "ext: $b"
          [ "$a" = "$b" ] || { echo "::error title=vaultcore drift::the extension is shipping a different core than the app"; exit 1; }

      # The unpacked tarball is built by build.sh, from the SAME file list as the .zip. It used to
      # be assembled here instead, and drifted: the NIP-07 signer's three files went into the zip
      # and not the tarball, which does not mean a partial add-on — the manifest names inject.js as
      # a content script, so Firefox refuses to load the whole thing. The release's own install
      # instructions pointed at that tarball.
      - name: Show what was built
        run: |
          ls -la extension/dist/
          tar tzf extension/dist/posterchan-passwords-unpacked.tar.gz
          # The Chrome bundle is the same sources with a GENERATED manifest; print the one key that
          # differs, because getting it wrong is the difference between "installs" and "Chrome refuses
          # to load this extension".
          python3 -c "import json;m=json.load(open('extension/dist/chrome/manifest.json'));print('chrome background:', m['background']);assert 'scripts' not in m['background']"
          unzip -l extension/dist/posterchan-passwords-chrome.zip | tail -5

      # Same reason as the APK workflow: GitHub stamps a release's date when the release OBJECT is
      # created, so replacing an asset under a rolling tag leaves it reading "2 days ago" next to a
      # build made a minute ago. Delete and let the next step recreate it with an honest date; the
      # tag and the download URL survive.
      - name: Read the version the manifest actually declares
        id: ver
        run: echo "v=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      # ---- AMO submission -------------------------------------------------------------------------
      # Only when the VERSION CHANGED in this push. AMO refuses a version string it has already seen
      # ("Version 1.1.1 already exists") and refuses it AFTER the upload completes, so a workflow that
      # submitted on every push to extension/ would fail on every commit that isn't a release. The
      # bump IS the release trigger.
      - name: Did the manifest version change?
        id: bump
        run: |
          cur='${{ steps.ver.outputs.v }}'
          # The commit the push STARTED from, not HEAD~1: a push can carry several commits, and if
          # the bump was the first of them HEAD~1 already shows the new version — reading "unchanged"
          # and silently skipping the release. Falls back to HEAD~1 for workflow_dispatch, where
          # there is no `before`.
          base='${{ github.event.before }}'
          case "$base" in ''|0000000*) base='HEAD~1';; esac
          prev=$(git show "$base:extension/manifest.json" 2>/dev/null \
                 | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo '')
          echo "previous=$prev current=$cur"
          if [ -n "$prev" ] && [ "$prev" = "$cur" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=AMO::version unchanged ($cur) — not submitting"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # Signs and submits the LISTED add-on. A listed version still goes through Mozilla's review;
      # this only automates the upload, which is the part that was manual and error-prone.
      #
      # It signs the SAME BYTES that ship: the zip built above is unpacked and handed to web-ext,
      # rather than pointing web-ext at extension/ — that directory also contains dist/ and any
      # untracked local edits, and "what was signed" must equal "what was tested".
      #
      # Skipped, not failed, when the secrets are absent: forks and PR runs have no access to them,
      # and a red build there would say "broken" when it means "not configured".
      - name: Submit to addons.mozilla.org
        if: steps.bump.outputs.changed == 'yes' && env.AMO_JWT_ISSUER != ''
        run: |
          set -euo pipefail
          rm -rf /tmp/ffsrc && mkdir -p /tmp/ffsrc
          unzip -q extension/dist/posterchan-passwords.zip -d /tmp/ffsrc
          test -f /tmp/ffsrc/manifest.json   # the zip is flat; a nested dir would sign an empty add-on
          npx --yes web-ext@8 sign \
            --source-dir /tmp/ffsrc \
            --channel listed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir /tmp/ffout \
            2>&1 | tee /tmp/amo.log || true
          # A LISTED submission does not come back with a signed file — it goes to human review — so
          # web-ext's exit code is not the signal. "Version already exists" and an auth failure are,
          # and both must be loud rather than a green tick on a submission that never happened.
          if grep -qiE 'already exists|JWT|401|Unauthorized|not authenticated' /tmp/amo.log; then
            echo "::error title=AMO submission rejected::see the log above"; exit 1
          fi
          grep -qiE 'submitted|uploaded|Your add-on' /tmp/amo.log \
            && echo "::notice title=AMO::version ${{ steps.ver.outputs.v }} submitted for review" \
            || { echo "::error title=AMO::no confirmation in web-ext output"; exit 1; }

      - name: Retire the previous rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete extension-latest --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-latest
          name: PosterChan Passwords — browser add-on (latest)
          body: |
            Autofill, one-time codes and a password generator for your PosterChan vault.

            **Firefox — just install it from Mozilla:**
            https://addons.mozilla.org/firefox/addon/posterchan-passwords/ — signed, permanent on
            release Firefox and Firefox for Android, and it auto-updates. The builds below are
            unsigned; they're for Chrome, or for running a build before it's through AMO review.

            **Desktop Firefox, unsigned:** download the `-unpacked.tar.gz`, extract it, then
            `about:debugging` → This Firefox → Load Temporary Add-on → pick `manifest.json`.
            (Temporary add-ons unload when Firefox restarts.)

            **Chrome / Edge / Brave:** download `posterchan-passwords-chrome.zip`, extract it, then
            `chrome://extensions` → turn on **Developer mode** → **Load unpacked** → pick the folder.
            (Chrome will not install a zip directly, and an unpacked extension stays until removed —
            it does not unload on restart the way Firefox's temporary add-ons do.)

            **Firefox Nightly / Developer Edition / ESR (permanent, unsigned):** in `about:config`
            set `xpinstall.signatures.required` to `false`, then `about:addons` → ⚙ → **Install
            Add-on From File** → pick `posterchan-passwords.xpi`. It survives restarts. (Release
            Firefox ignores that pref, so this path is Nightly/Dev/ESR only.)

            **Release Firefox / Android:** use the AMO link at the top. A build from here is
            unsigned, so release Firefox installs it temporarily at best, and Firefox for Android
            not at all. See docs/PASSWORDS.md.

            **Nostr sign-in (NIP-07):** once paired with full access, this provides `window.nostr`,
            so a Nostr site can log you in with your key. Each site is asked for once, per event
            kind, in a real browser window; review or revoke it under **Sites** in the popup.

            Pair it from the app: Passwords → Pair a device.

            Version ${{ steps.ver.outputs.v }} (build ${{ github.run_number }}).
          files: |
            extension/dist/posterchan-passwords.xpi
            extension/dist/posterchan-passwords.zip
            extension/dist/posterchan-passwords-unpacked.tar.gz
            extension/dist/posterchan-passwords-chrome.zip
          make_latest: false
