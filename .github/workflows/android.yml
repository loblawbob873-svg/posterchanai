name: Android APK

# Builds the PosterChan native Android app (Capacitor) on GitHub's runners — this box can't run the
# Gradle daemon. On every push that touches the client or the app project, it rebuilds the bundled web
# UI, compiles + signs the APK, and publishes it to a rolling "apk-latest" GitHub Release. poster.place/apk
# redirects to that asset, so users always get the newest build.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'static/js/client/**'
      - 'static/css/client.css'
      # The translation catalogues are COPIED INTO the bundle, so a new language (or new strings in
      # an existing one) reaches the app only through a rebuild — on the web the server just serves
      # the new file, which is why this was easy to miss.
      - 'static/i18n/**'
      - 'templates/client.html'
      - 'mobile/**'
      - 'zapstore.yaml'
      - 'scripts/zsp-signing-lineage.patch'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# ONE BUILD PER BRANCH AT A TIME, AND THE ONE THAT IS RUNNING FINISHES.
#
# `cancel-in-progress: true` was here to stop a burst of pushes starving the free runners, and it
# did — by making the APK for the fix somebody was waiting on the one that never got built. Every
# push cancels the build before it, so in a busy hour the ONLY commit that produces an installable
# artifact is whichever one happened to be last, and it is nearly never the interesting one.
#
# That is not hypothetical. The commit that fixed the launcher icons (fc0dd762, "the icons were
# packed arc flags") was cancelled by the next push, and the newest APK on the release stayed at a
# commit from BEFORE the fix — so the fix was verified on a real device, shipped to both remotes,
# and reported by its owner as still broken, because the build they installed could not contain it.
# Two more rounds were spent on that.
#
# So a queued push now WAITS instead of killing what is running. The runner cost is a few extra
# minutes; the cost of the other setting is a person judging a build that predates the work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed Android signing secrets
        run: python3 scripts/check_no_android_signing_secrets.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # No `|| npm install` fallback. That fallback defeated the whole point: mobile/package-lock.json was
      # missing @capacitor/clipboard, so `npm ci` failed on EVERY run and the build silently re-resolved
      # the entire tree from the registry — the same exposure as an unlocked build, but disguised as a
      # locked one. The lock is now in sync (regenerated with `--before` a known-good date, after the
      # Shai-Hulud npm worm), so ci succeeds; if it ever fails again the build must STOP, because a
      # failure here means the lock no longer describes what would be installed.
      - name: Install Capacitor deps
        working-directory: mobile
        run: npm ci

      - name: Version from run number
        run: |
          echo "VCODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VNAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "PC_APP_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build web bundle (www)
        working-directory: mobile
        run: bash build-www.sh      # reads PC_APP_BUILD → bakes __PC_APP_BUILD__ into the bundle for the updater

      - name: Test bundled Concord composer repaint safety
        working-directory: mobile
        run: |
          test -s www/static/js/client/concord-cache.js
          node --check www/static/js/client/concord-cache.js
          node ../tests/client/concord_runtime.mjs www/static/js/client/concord.js
          # DM startup/cache ordering, shared phone pressure and retries must pass on the bundle.
          node ../tests/client/dm_delivery_runtime.mjs www/static/js/client/app.js
          node ../tests/client/dm_retry_runtime.mjs www/static/js/client/app.js
          node ../tests/client/extension_interactive_priority_runtime.mjs www/static/js/client/app.js
          node ../tests/client/vault_background_sync_runtime.mjs www/static/js/client/vault.js
          node ../tests/client/concord_social_emoji_runtime.mjs www/static/js/client/app.js
          node ../tests/client/terminal_partial_replay_runtime.mjs www/static/js/client/term.js
          node ../tests/client/terminal_hosts_runtime.mjs www/static/js/client/term.js

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Build & sign release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          POSTERCHAN_ANDROID_KEYSTORE: ${{ runner.temp }}/posterchan-release.keystore
          POSTERCHAN_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          POSTERCHAN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POSTERCHAN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          ANDROID_SIGNING_LINEAGE_BASE64: ${{ secrets.ANDROID_SIGNING_LINEAGE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo '::error::ANDROID_KEYSTORE_BASE64 is not configured'; exit 1; }
          test -n "$POSTERCHAN_ANDROID_STORE_PASSWORD" || { echo '::error::ANDROID_STORE_PASSWORD is not configured'; exit 1; }
          test -n "$POSTERCHAN_ANDROID_KEY_ALIAS" || { echo '::error::ANDROID_KEY_ALIAS is not configured'; exit 1; }
          test -n "$POSTERCHAN_ANDROID_KEY_PASSWORD" || { echo '::error::ANDROID_KEY_PASSWORD is not configured'; exit 1; }
          test -n "$ANDROID_SIGNING_CERT_SHA256" || { echo '::error::ANDROID_SIGNING_CERT_SHA256 is not configured'; exit 1; }
          test -n "$ANDROID_SIGNING_LINEAGE_BASE64" || { echo '::error::ANDROID_SIGNING_LINEAGE_BASE64 is not configured; refusing to ship a signer change that existing Android installations cannot verify'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$POSTERCHAN_ANDROID_KEYSTORE"
          chmod 600 "$POSTERCHAN_ANDROID_KEYSTORE"
          chmod +x gradlew
          # Build unsigned; the next step applies only the current signer plus the already-verified
          # public proof-of-rotation. The retired private key must never enter a runner again.
          # JitPack occasionally times out while resolving the MMS/streaming libraries. Retry the
          # identical unsigned build; signing and certificate verification still happen only once,
          # after a complete build succeeds.
          built=0
          for attempt in 1 2 3; do
            if POSTERCHAN_ANDROID_KEYSTORE='' POSTERCHAN_ANDROID_STORE_PASSWORD='' \
               POSTERCHAN_ANDROID_KEY_ALIAS='' POSTERCHAN_ANDROID_KEY_PASSWORD='' \
                 ./gradlew assembleRelease -PversionCode=$VCODE -PversionName=$VNAME; then
              built=1
              break
            fi
            echo "::warning::Android dependency/build attempt $attempt failed"
          done
          test "$built" = 1 || { echo '::error::Android release build failed after 3 attempts'; exit 1; }

      - name: Collect the APK
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          ANDROID_SIGNING_LINEAGE_BASE64: ${{ secrets.ANDROID_SIGNING_LINEAGE_BASE64 }}
          POSTERCHAN_ANDROID_KEYSTORE: ${{ runner.temp }}/posterchan-release.keystore
          POSTERCHAN_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          POSTERCHAN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POSTERCHAN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=$(find mobile/android -path '*release*' -name '*.apk' | head -1)
          echo "found: $APK"
          test -n "$APK" || { echo '::error::No release APK was produced'; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo '::error::apksigner was not found'; exit 1; }
          printf '%s' "$ANDROID_SIGNING_LINEAGE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-lineage"
          UNSIGNED_APK="$APK"
          # One safe artifact cannot cover both generations. v1/v2 require the oldest private key
          # when a lineage is supplied, and that key is retired. The primary artifact is therefore
          # v3-only for Android 9+ upgrades; Android 8 gets a separate current-signer reinstall APK.
          $APKSIGNER sign \
            --min-sdk-version 28 \
            --ks "$POSTERCHAN_ANDROID_KEYSTORE" \
            --ks-key-alias "$POSTERCHAN_ANDROID_KEY_ALIAS" \
            --ks-pass env:POSTERCHAN_ANDROID_STORE_PASSWORD \
            --key-pass env:POSTERCHAN_ANDROID_KEY_PASSWORD \
            --lineage "$RUNNER_TEMP/signing-lineage" \
            --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false \
            --v3-signing-enabled true --v4-signing-enabled true \
            --out "$RUNNER_TEMP/posterchan-api28.apk" "$UNSIGNED_APK"
          $APKSIGNER sign \
            --min-sdk-version 26 \
            --ks "$POSTERCHAN_ANDROID_KEYSTORE" \
            --ks-key-alias "$POSTERCHAN_ANDROID_KEY_ALIAS" \
            --ks-pass env:POSTERCHAN_ANDROID_STORE_PASSWORD \
            --key-pass env:POSTERCHAN_ANDROID_KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled true \
            --out "$RUNNER_TEMP/posterchan-android8.apk" "$UNSIGNED_APK"
          API28_APK="$RUNNER_TEMP/posterchan-api28.apk"
          ANDROID8_APK="$RUNNER_TEMP/posterchan-android8.apk"
          ROTATED_VERIFY=$($APKSIGNER verify --min-sdk-version 28 --verbose --print-certs "$API28_APK" 2>&1) || {
            printf '%s\n' "$ROTATED_VERIFY"
            echo '::error::apksigner rejected the rotated APK for Android 9+'; exit 1;
          }
          printf '%s\n' "$ROTATED_VERIFY"
          ACTUAL_CERT=$(printf '%s\n' "$ROTATED_VERIFY" \
            | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' \
            | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED_CERT=$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL_CERT" || { echo '::error::The release APK is unsigned'; exit 1; }
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo "::error::Release signer mismatch (actual $ACTUAL_CERT)"; exit 1;
          }
          printf '%s\n' "$ROTATED_VERIFY" | grep -Eq 'Verified using v3 scheme.*:[[:space:]]*true' || {
            echo '::error::The Android 9+ APK does not contain a v3 proof-of-rotation'; exit 1;
          }
          if $APKSIGNER verify --min-sdk-version 26 --max-sdk-version 27 "$API28_APK" >/dev/null 2>&1; then
            echo '::error::The Android 9+ lineage APK unexpectedly claims Android 8 compatibility'; exit 1;
          fi
          FRESH_ANDROID8_VERIFY=$($APKSIGNER verify --min-sdk-version 26 --max-sdk-version 27 --verbose --print-certs "$ANDROID8_APK" 2>&1) || {
            printf '%s\n' "$FRESH_ANDROID8_VERIFY"
            echo '::error::apksigner rejected the current-signer APK for an Android 8 fresh install'; exit 1;
          }
          printf '%s\n' "$FRESH_ANDROID8_VERIFY"
          FRESH_ANDROID8_CERT=$(printf '%s\n' "$FRESH_ANDROID8_VERIFY" \
            | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' \
            | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$FRESH_ANDROID8_CERT" = "$EXPECTED_CERT" || {
            echo "::error::Android 8 APK unexpectedly uses a retired signer (actual $FRESH_ANDROID8_CERT)"; exit 1;
          }
          ANDROID8_JAR_VERIFY=$($APKSIGNER verify --min-sdk-version 23 --max-sdk-version 23 --verbose "$ANDROID8_APK" 2>&1) || {
            printf '%s\n' "$ANDROID8_JAR_VERIFY"
            echo '::error::The Android 8 reinstall APK has no usable v1 signature'; exit 1;
          }
          printf '%s\n' "$ANDROID8_JAR_VERIFY" | grep -Eq 'Verified using v1 scheme.*:[[:space:]]*true' || {
            echo '::error::The Android 8 reinstall APK lacks a v1 signature'; exit 1;
          }
          printf '%s\n' "$FRESH_ANDROID8_VERIFY" | grep -Eq 'Verified using v2 scheme.*:[[:space:]]*true' || {
            echo '::error::The Android 8 reinstall APK lacks a v2 signature'; exit 1;
          }
          cp "$API28_APK" posterchan.apk
          cp "$ANDROID8_APK" posterchan-android8-reinstall.apk
          ls -la posterchan.apk posterchan-android8-reinstall.apk
          python3 scripts/check_android_apk_assets.py posterchan.apk "$PWD"
          python3 scripts/check_android_apk_assets.py posterchan-android8-reinstall.apk "$PWD"

      # GitHub stamps a release's publish date ONCE, when the release object is created — replacing the asset
      # under a rolling tag never touches it. So apk-latest kept showing "2 days ago" next to a brand-new APK,
      # which reads as an abandoned project. Deleting the release (the TAG survives, and so does the
      # /releases/download/apk-latest/posterchan.apk URL that poster.place/apk + refresh.sh depend on) makes
      # the next step create it fresh, with an honest date. Never fail the build over this — a missing release
      # is re-created moments later, and the server keeps serving its local mirror meanwhile.

      # RELEASE NOTES, WRITTEN FROM WHAT IS ACTUALLY IN THE BUILD. Zapstore publishing has been
      # automated since it was set up, but every release went out with NO NOTES — a version number
      # and nothing about what changed. `zsp` reads them from the `release_notes:` path in
      # zapstore.yaml, so they are generated here, before it runs.
      #
      # The window is "since the commit the PREVIOUS rolling release was built from", recovered from
      # that release's own body — which is why the body carries the marker below. Read BEFORE the
      # release is deleted and re-created, or the marker is already gone. A missing or unusable
      # marker is not a failure: the generator falls back to a recent window and says so.
      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(gh release view apk-latest --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null \
                 | grep -oE 'built-from: [0-9a-f]{7,40}' | head -1 | cut -d' ' -f2 || true)
          echo "previous build: ${PREV:-<none>}"
          python3 scripts/release_notes.py --since "$PREV" \
            --version "1.0.${{ github.run_number }}" --out RELEASE_NOTES.md
          {
            echo 'NOTES<<PCEOF'
            cat RELEASE_NOTES.md
            echo
            echo "<!-- built-from: $GITHUB_SHA -->"
            echo PCEOF
          } >> "$GITHUB_ENV"

      - name: Retire the previous rolling release (so the new one is dated today)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete apk-latest --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: PosterChan APK (latest)
          body: |
            Latest PosterChan Android APK — auto-built from the web client. Version 1.0.${{ github.run_number }}.

            `posterchan.apk` is the Android 9+ update with signing-key lineage. Android 8/8.1 users
            must export their data, uninstall the old-key build, then install
            `posterchan-android8-reinstall.apk`; it is not an in-place update.

            ${{ env.NOTES }}
          files: |
            posterchan.apk
            posterchan-android8-reinstall.apk
          make_latest: true

      # Publish only the API 28+ lineage APK to Zapstore. The Android 8 current-signer reinstall is a
      # separately named GitHub asset so no store can mistake it for an in-place old-signer update. Config lives in
      # zapstore.yaml; `zsp` reads the version straight out of the APK, uploads it to Blossom and publishes the
      # NIP-82 app/release events. Skipped (not failed) when SIGN_WITH isn't set, so forks still build an APK.
      # NB: -q, not -y — the upstream docs advertise a -y flag the binary doesn't actually have.
      # Cache the zsp binary so a throttled GitHub release CDN cannot fail this step. Keyed on the
      # pinned version, so bumping zsp downloads it exactly once.
      - name: Cache zsp
        uses: actions/cache@v4
        with:
          path: ~/.cache/zsp
          key: zsp-v0.4.11-posterchan-lineage-v3

      # The APK is already safe on GitHub Releases, but this step must still fail loudly if Zapstore
      # rejects its asset. A green workflow previously hid a listing whose newest release pointed at
      # an asset AppCatalog could not fetch, leaving installed clients at "Certificate mismatch".
      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZSP_CACHE: ~/.cache/zsp
          # Publish the API 28+ current-signer listing. Existing Android 9+ installations signed by
          # the retired key upgrade through the APK's embedded proof-of-rotation. Android 8's
          # explicitly named reinstall artifact is never offered through this store path.
          RELAY_URLS: wss://relay.poster.place,wss://relay.primal.net,wss://relay.zapstore.dev
          POSTERCHAN_ANDROID_KEYSTORE: ${{ runner.temp }}/posterchan-release.keystore
          POSTERCHAN_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          POSTERCHAN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POSTERCHAN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          fail(){ echo "::error title=Zapstore publish failed::The APK was published to GitHub Releases, but Zapstore was not updated: $1"; exit 1; }
          # Surface the skip as a run ANNOTATION, not just a log line: this step exits 0 either way (a fork
          # with no key must still build an APK), so a silent skip renders as a green tick and reads exactly
          # like a successful publish. Say which one actually happened.
          if [ -z "$SIGN_WITH" ]; then
            echo "::warning title=Zapstore skipped::ZAPSTORE_SIGN_WITH is not set — the APK shipped to GitHub Releases but was NOT published to Zapstore."
            exit 0
          fi
          # RETRIED, because this one download is the only part of the release that depends on a host
          # nobody here controls — and it has already failed once for a reason that had nothing to do
          # with the build: `curl: (60) SSL certificate problem: self-signed certificate`, a TLS blip
          # on the way to GitHub's release CDN. The APK was built, signed and uploaded; the run went
          # red at the last step and the release did not go out. `--retry-all-errors` is what makes
          # curl retry a handshake failure (plain --retry only covers transient HTTP codes).
          # Reuse a cached copy when the step above restored one: this download is from GitHub's
          # release CDN, which THROTTLES — measured here as two straight `curl: (22) ... 503`s, the
          # same throttling that was failing the desktop build's electron download the same evening.
          # Retries do not beat a throttle; not downloading does.
          if [ -x "$ZSP_CACHE/zsp" ]; then
            cp "$ZSP_CACHE/zsp" /tmp/zsp
            echo "zsp restored from cache"
          else
            git clone --depth 1 --branch v0.4.11 https://github.com/zapstore/zsp.git /tmp/zsp-src
            git -C /tmp/zsp-src apply --unidiff-zero "$GITHUB_WORKSPACE/scripts/zsp-signing-lineage.patch"
            (cd /tmp/zsp-src && go build -trimpath -o /tmp/zsp .)
            mkdir -p "$ZSP_CACHE" && cp /tmp/zsp "$ZSP_CACHE/zsp"
          fi
          chmod +x /tmp/zsp
          # Prove the APK's signing certificate belongs to this npub (NIP-C1, kind 30509). Without it Zapstore
          # can't tie the app to a developer key and warns users it "cannot reach signer key" — and `publish -q`
          # auto-SKIPS this step, so it has to be run explicitly. Use the CI-only signing key material
          # reconstructed by the build step; a private APK signing key must never live in source control.
          #
          # zsp rejects a Java KeyStore ("JKS format is not supported directly") and wants PKCS12, so convert a
          # throwaway copy first. Gradle keeps signing from the original JKS — nothing about the APK changes.
          keytool -importkeystore -noprompt \
            -srckeystore "$POSTERCHAN_ANDROID_KEYSTORE" -srcstorepass "$POSTERCHAN_ANDROID_STORE_PASSWORD" \
            -srcalias "$POSTERCHAN_ANDROID_KEY_ALIAS" -srckeypass "$POSTERCHAN_ANDROID_KEY_PASSWORD" \
            -destkeystore /tmp/release.p12 -deststoretype PKCS12 \
            -deststorepass "$POSTERCHAN_ANDROID_KEY_PASSWORD" -destkeypass "$POSTERCHAN_ANDROID_KEY_PASSWORD"
          # `zsp identity` has NO non-interactive flag: it prints a "private key found in environment" warning
          # and waits at a confirmation prompt, which in CI just hangs up and exits non-zero. So take the path
          # its own docs give for automation — --offline emits the SIGNED kind-30509 and we publish it
          # ourselves (their example pipes it to `nak event`).
          KEYSTORE_PASSWORD="$POSTERCHAN_ANDROID_KEY_PASSWORD" /tmp/zsp identity --link-key /tmp/release.p12 --offline \
            > /tmp/cert.json 2>/tmp/cert.err || true
          pip install -q websockets
          python3 scripts/publish_cert_proof.py /tmp/cert.json /tmp/cert.err
          if ! /tmp/zsp publish -q zapstore.yaml 2>&1 | tee /tmp/zsp-publish.log; then
            fail 'zsp could not publish a complete release'
          fi
          # A secondary relay accepting the event is not enough: Zapstore's current client resolves
          # latestAsset directly from its AppCatalog relay. Never report success while that relay
          # rejects the clean current-signer asset.
          if grep -Fq 'software_asset -> wss://relay.zapstore.dev: FAILED' /tmp/zsp-publish.log; then
            fail 'Zapstore AppCatalog rejected the clean APK asset'
          fi
          echo "::notice title=Zapstore::Published 1.0.${{ github.run_number }} to Zapstore."
