name: Desktop apps

# Builds the PosterChan desktop app (Electron) for Windows, Linux and macOS on GitHub's runners and
# publishes every artifact to the rolling "desktop-latest" GitHub Release. poster.place/desktop serves
# those assets (and the electron-updater feed) — see the /desktop routes in app/main.py.
#
# The desktop app BUNDLES the web client (desktop/build-www.sh), so a static/js/client change has to be
# built and released before desktop users see it — which is why the path filter below watches those files
# too, exactly as android.yml does. It used to be a thin shell that loaded <instance>/client live; that
# is what made it depend on a server being reachable, and the whole point of bundling is that it no
# longer does.
#
# Signing: Windows and Linux artifacts are unsigned — SmartScreen shows a "more info" prompt on first
# run. macOS is unsigned too, which additionally means NO auto-update there (Squirrel.Mac requires a
# signature); Mac users get the new .dmg from poster.place/desktop/mac.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'desktop/**'
      - 'static/js/client/**'
      - 'static/css/client.css'
      # Same as android.yml: the catalogues live IN the bundle, so a language change ships only with
      # a rebuild.
      - 'static/i18n/**'
      - 'templates/client.html'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

# One build per branch at a time, newest wins — a burst of pushes otherwise starves the
# free runners and the stragglers fail on missing artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tor Expert Bundle version. Bump deliberately — a bad value fails the build (see "Bundle Tor"), which
  # is the intended behaviour: shipping an installer whose Tor switch does nothing is worse than not
  # shipping one.
  TOR_VERSION: '14.5.8'

permissions:
  contents: write

jobs:
  build:
    # Named explicitly, because every matrix value otherwise lands in the job name and `caches` below
    # is a multi-line string — which rendered the three jobs as "build (windows-latest, windows,
    # build:win, windows-x86_64, ~\AppData\Local\electron\Cache ⏎ ~\AppDa...".
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `caches` = the two directories electron-builder downloads into, per OS. They are DIFFERENT
          # roots and both matter: the Electron dist zip (115 MB) goes to the ELECTRON cache, while
          # winCodeSign/NSIS/nsis-resources go to the ELECTRON-BUILDER one. Verified by observation,
          # not from the name: with `ELECTRON_BUILDER_CACHE` pointed elsewhere, a build still resolved
          # electron out of ~/.cache/electron and left the override directory empty. See "Cache".
          - os: windows-latest
            name: windows
            script: build:win
            tor: windows-x86_64
            caches: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
          - os: ubuntu-latest
            name: linux
            script: build:linux
            tor: linux-x86_64
            caches: |
              ~/.cache/electron
              ~/.cache/electron-builder
          - os: macos-latest
            name: mac
            script: build:mac
            caches: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
            # BOTH Mac architectures, because electron-builder packs ONE extraResources tree into the x64
            # and arm64 .dmgs alike and a Mach-O is built for one or the other. Shipping only x86_64 made
            # the Tor switch depend on Rosetta — which an Apple Silicon Mac does not have until something
            # asks for it, and a native arm64 app never does, so tor was the first thing to ask and it
            # failed to exec. The arm64 binary goes in a subdirectory that tor.js prefers by process.arch
            # (geoip is architecture-independent and stays shared).
            tor: macos-x86_64
            tor_arm64: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tor, bundled. The app advertises native Tor, so this must be a HARD failure: an installer that
      # ships the switch without the binary is a promise the app cannot keep, and the user has no way to
      # tell. Extracted verbatim into desktop/resources/tor, whose layout tor.js expects —
      #   tor/tor(.exe)   the binary + its shared libraries
      #   data/geoip{,6}  the country database, WITHOUT WHICH the exit-country picker silently does
      #                   nothing (tor bootstraps, reports 100%, and ignores ExitNodes)
      - name: Bundle Tor
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          V="${TOR_VERSION}"
          P="${{ matrix.tor }}"
          URL="https://archive.torproject.org/tor-package-archive/torbrowser/${V}/tor-expert-bundle-${P}-${V}.tar.gz"
          echo "Fetching $URL"
          mkdir -p resources/tor
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o tor.tar.gz
          tar -xzf tor.tar.gz -C resources/tor
          rm -f tor.tar.gz
          # Prove the two things tor.js needs are actually there. `find` rather than a fixed path because
          # the archive has moved the binary between releases; tor.js accepts either shape.
          BIN="$(find resources/tor -maxdepth 2 -name 'tor' -o -maxdepth 2 -name 'tor.exe' | head -1)"
          test -n "$BIN" || { echo "::error::no tor binary in the expert bundle"; ls -R resources/tor; exit 1; }
          GEO="$(find resources/tor -maxdepth 2 -name 'geoip' | head -1)"
          test -n "$GEO" || { echo "::error::no geoip database — the exit-country picker would be a no-op"; ls -R resources/tor; exit 1; }
          chmod +x "$BIN" || true
          echo "tor: $BIN"; echo "geoip: $GEO"

          # The second architecture, where there is one (macOS). Only the tor/ directory is taken —
          # its binary and dylib — because data/geoip is the same file on every architecture and is
          # 15 MB. tor.js looks in <root>/<process.arch>/ first and falls back to the base tree, so an
          # architecture we do not ship is not a special case anywhere in the app.
          P2="${{ matrix.tor_arm64 || '' }}"
          if [ -n "$P2" ]; then
            URL2="https://archive.torproject.org/tor-package-archive/torbrowser/${V}/tor-expert-bundle-${P2}-${V}.tar.gz"
            echo "Fetching $URL2"
            mkdir -p resources/tor/arm64
            curl -fsSL --retry 3 --retry-delay 5 "$URL2" -o tor-arm64.tar.gz
            tar -xzf tor-arm64.tar.gz -C resources/tor/arm64 tor
            rm -f tor-arm64.tar.gz
            BIN2="resources/tor/arm64/tor/tor"
            test -f "$BIN2" || { echo "::error::no arm64 tor binary — Apple Silicon would need Rosetta"; ls -R resources/tor/arm64; exit 1; }
            # Same architecture check the app cannot make for itself: an x86_64 binary sitting in the
            # arm64 slot would exec fine on an Intel Mac and fail on the machines this is FOR.
            file "$BIN2" | grep -q arm64 || { echo "::error::arm64 slot holds $(file "$BIN2")"; exit 1; }
            chmod +x "$BIN2" || true
            echo "tor (arm64): $BIN2"
          fi

      # The real cure for the throttled downloads: once these are warm nothing is fetched from
      # GitHub's release CDN at all, so a throttle there cannot fail the job.
      #
      # THE POSITION OF THIS STEP IS THE FEATURE, and it has been wrong twice — once in each
      # direction, so both are written down here.
      #
      # It must sit ABOVE `Install deps`, because the Electron zip is downloaded TWICE by two
      # different things. Placed below, `npm ci` died in the electron package's own postinstall
      # (`node install.js` → @electron/get → `RequestError: socket hang up`), three retries deep,
      # before the cache step it needed had even run. Both writers share this ONE root:
      # ~/.cache/electron holds @electron/get's `<sha256-of-url>/` directory AND app-builder's flat
      # `electron-v33.4.11-<platform>.zip` — confirmed by inspecting a real build's cache, not
      # inferred. So a single warm restore kills both downloads.
      #
      # And it must sit ABOVE `Version from run number`, because that step is `npm version`, which
      # REWRITES package-lock.json — with the run number, i.e. differently on every single run. Keyed
      # after it, `hashFiles` never matched twice: every build missed the exact key, fell through to
      # `restore-keys`, and then saved a whole fresh copy. Measured, that was ~724 MB of new cache per
      # run against a 10 GB repo budget that evicts by LRU — the caches would have started evicting
      # each other (and every other workflow's) within a dozen pushes, at which point this quietly
      # stops working. Above it, the lockfile is the committed one and the key is stable, so a run
      # that changes nothing re-saves nothing.
      #
      # `restore-keys` still matters for the run that DOES bump electron: it starts from the previous
      # cache, since the builder deps in the second directory are version-independent.
      - name: Cache electron + electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ${{ matrix.caches }}
          key: ebcache-${{ matrix.name }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: ebcache-${{ matrix.name }}-

      # Version == the run number, like the APK's versionCode. electron-updater compares this against
      # the feed's `version`, so it MUST increase on every build or no client ever sees an update.
      - name: Version from run number
        working-directory: desktop
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      # `npm ci`, NEVER `npm install`. install re-resolves every caret range against the registry on
      # every build, so a dependency compromised between two builds ships in the next installer with
      # nothing in the diff to show it — and electron-builder pulls the whole got/keyv/cacheable-request
      # chain the Shai-Hulud npm worm went after (keyv 6.0.0 was published and unpublished inside one
      # day, 2026-08-04). ci installs desktop/package-lock.json verbatim, verifies every integrity hash,
      # and FAILS if package.json and the lock disagree instead of quietly picking something newer.
      # The lock is committed for exactly this reason — see desktop/.gitignore.
      # (`npm version` above rewrites the version in both files, so they stay in sync for this step.)
      # RETRIED, because the failure this hits is not ours and not deterministic. Electron's
      # postinstall DOWNLOADS its binary, so `npm ci` reaches the network long after the registry
      # step is done — and a runner behind a TLS-intercepting proxy answers that with
      # "RequestError: self-signed certificate", failing the mac build in ~25s while the same commit
      # builds cleanly on the next push. Three attempts turns a random red into a self-healing one;
      # a real breakage still fails all three and still fails the job.

      - name: Install deps
        working-directory: desktop
        # `shell: bash` is REQUIRED, not stylistic. Windows runners default to PowerShell, which
        # parses a bash for-loop as a syntax error before running anything — the retry added here
        # broke the Windows build outright while Linux and macOS carried on. The Bundle Tor step
        # above already declares it, for the same reason.
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $i/3) — retrying in $((i*15))s"
            rm -rf node_modules
            sleep $((i*15))
          done
          echo "::error::npm ci failed three times"
          exit 1

      - name: Build
        working-directory: desktop
        # RETRIED, for the same reason `npm ci` above is, and with the same `shell: bash` (a Windows
        # runner defaults to PowerShell and would not parse the loop at all).
        #
        # electron-builder fetches its own helpers at build time — the Electron dist zip, winCodeSign,
        # NSIS, nsis-resources — from GitHub's release CDN, through app-builder's Go downloader, whose
        # stack frame for this is literally `DownloadNoRetry`. One refused download kills the whole
        # job minutes in, after the bundle and Tor are already staged.
        #
        # It is THROTTLING, not a one-off glitch, and the backoff is sized for that. Measured across
        # three runs it hit whichever runner it felt like and gave a different error each time —
        # Linux `Get ".../electron-v33.4.11-linux-x64.zip": EOF`, then Windows `...nsis-resources
        # -3.4.1.7z": EOF`, then Windows `cannot resolve .../electron-v33.4.11-win32-x64.zip: status
        # code 503` — while the other platforms of the same commit published fine and the same asset
        # served instantly (HTTP 206) from outside Actions. A first attempt at this retried 3x over
        # 100s and all three attempts got the 503, which is what says "throttle", so the window is now
        # ~9 minutes. The Cache step above is the actual cure; this is what gets through the run that
        # has to fill it.
        #
        # Nothing is cleaned between attempts: the downloader writes to a temp path and renames on
        # success, so a failure leaves no partial file to poison, and whatever DID land is reused.
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npm run ${{ matrix.script }} && exit 0
            [ $i -eq 5 ] && break
            d=$((i*i*30))
            echo "::warning::${{ matrix.script }} failed (attempt $i/5) — retrying in ${d}s"
            sleep $d
          done
          echo "::error::${{ matrix.script }} failed five times"
          exit 1

      # Test the bytes that electron-builder is about to package, not merely the checkout. A missing
      # copy line in build-www.sh previously produced a successful installer with Concord absent or
      # completely unstyled even though every source-level Concord test passed.
      - name: Audit bundled Concord surface
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          test -s www/static/css/concord.css
          test -s www/static/js/client/concord.js
          test -s www/static/js/client/cord-reader.js
          # Execute the monitor-destination behavior against the files that will be packaged.  A
          # source-only test cannot catch build-www omitting or replacing the fixed Concord bundle.
          node ../tests/client/messages_handoff_destination_runtime.mjs www/static/js/client/concord.js
          grep -Fq '__pcConcordHandoff' www/static/js/client/os.js
          grep -Fq 'messagesHandoffState' www/static/js/client/app.js
          test -s www/static/js/client/cord-protocol.js
          grep -q 'data-view="messages"' www/index.html
          grep -q 'static/css/concord.css' www/index.html
          grep -q 'static/js/client/concord.js' www/index.html
          grep -q 'static/js/client/cord-reader.js' www/index.html

      # Insurance: `--publish never` means electron-builder doesn't run its publisher, and whether it
      # still writes the update feed varies by version. Generate it from the built bytes when missing —
      # a shipped app with no feed silently never updates.
      - name: Ensure the update feed exists
        if: matrix.name != 'mac'
        working-directory: desktop
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "windows" ]; then
            node scripts/make-update-yml.js dist PosterChan-Setup.exe latest.yml
          else
            node scripts/make-update-yml.js dist PosterChan.AppImage latest-linux.yml
          fi
          ls -la dist

      # ── A PLAIN TARBALL, FOR THE MACHINES THAT SHOULD NEVER SEE AN APPIMAGE ──────────────────
      #
      # PosterChanOS installs the desktop into /opt and execs it from sway. An AppImage is a
      # squashfs image with a runtime stapled to the front: mounting one needs FUSE, which a minimal
      # profile does not have, and it verifies itself on every start. Both the installer and the
      # ebuild were therefore EXTRACTING it -- downloading a self-mounting archive purely to unpack
      # it and throw the wrapper away, and inheriting its failure modes on the way ("VERIFY FAILED"
      # on a machine that only ever wanted the files inside).
      #
      # electron-builder already produces exactly those files in dist/linux-unpacked on its way to
      # building the image. Shipping THEM is strictly less machinery: no FUSE, no self-verification,
      # no squashfs, and a checksum portage can pin. The AppImage stays for everyone else -- it is
      # what auto-updates on an ordinary Linux desktop -- so this adds a format rather than
      # replacing one.
      - name: Pack the unpacked build for PosterChanOS
        if: matrix.name == 'linux'
        working-directory: desktop
        shell: bash
        run: |
          test -d dist/linux-unpacked || { echo "::error::no linux-unpacked to pack"; exit 1; }
          test -x dist/linux-unpacked/resources/tor/tor/tor || {
            echo "::error::packaged Tor is not executable — first-run would fail with EACCES"; exit 1;
          }
          ver="$(node -p "require('./package.json').version")"
          # zstd: in the base system on the machines that consume this (the live image already needs
          # it for its squashfs), and far quicker to unpack than xz on a first boot.
          tar -C dist/linux-unpacked -caf "dist/PosterChan-${ver}-linux-x64.tar.zst" .
          ( cd dist && sha512sum "PosterChan-${ver}-linux-x64.tar.zst" \
              >"PosterChan-${ver}-linux-x64.tar.zst.sha512" )
          ls -la dist/PosterChan-*.tar.zst*

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/*.AppImage
            desktop/dist/*.tar.zst
            desktop/dist/*.tar.zst.sha512
            desktop/dist/*.dmg
            desktop/dist/latest*.yml

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what we're shipping
        run: ls -la artifacts

      # A workflow run number is normally monotonic, but it is not a globally unique release
      # identity: restored/recreated Actions metadata and old manual releases can leave the same
      # version tag behind. softprops correctly refuses to move that tag, yet it will still replace
      # the release assets. That produced an apparently immutable 1.0.1088 whose bytes came from a
      # newer commit while its tag still named an older one. Fail before uploading a byte whenever
      # the proposed immutable tag belongs to any other commit.
      - name: Guard immutable version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: desktop-v1.0.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          existing=""
          # `gh api` writes the JSON 404 body to stdout as well as failing. Assign only on success;
          # `... || true` inside command substitution mistakes that body for an existing SHA and
          # rejects every genuinely unused version.
          if found="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION_TAG" \
            --jq .object.sha 2>/dev/null)"; then
            existing="$found"
          fi
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::immutable tag $VERSION_TAG already names $existing, not $GITHUB_SHA"
            exit 1
          fi

      # Publish the immutable Gentoo payload before touching the rolling release. A transient upload
      # failure in any Windows/macOS installer must never prevent Portage's permanent, checksummed
      # source URI from being created.
      - name: Publish the versioned tarball the Gentoo overlay pins
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PosterChan Desktop 1.0.${{ github.run_number }}
          body: |
            Permanent per-version tarball for the PosterChanOS Gentoo overlay
            (`app-misc/posterchan-desktop`). Never deleted, so a pinned Manifest keeps resolving.
          make_latest: false
          files: |
            artifacts/PosterChan-*-linux-x64.tar.zst
            artifacts/PosterChan-*-linux-x64.tar.zst.sha512

      - name: Verify immutable version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: desktop-v1.0.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION_TAG" --jq .object.sha)"
          test "$actual" = "$GITHUB_SHA" || {
            echo "::error::published $VERSION_TAG names $actual, not $GITHUB_SHA"
            exit 1
          }

      # GitHub stamps a release's publish date ONCE, when the release object is created — replacing the
      # assets under a rolling tag never touches it, so desktop-latest would keep showing an old date
      # next to a fresh build. Deleting the release (the TAG and therefore every
      # /releases/download/desktop-latest/... URL survives) makes the next step re-create it with an
      # honest date. Never fail the build over this. make_latest stays false so the APK release keeps
      # the repo's "Latest" badge.
      - name: Retire the previous rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete desktop-latest --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: PosterChan Desktop (latest)
          body: |
            PosterChan desktop app — auto-built from `desktop/`. Version 1.0.${{ github.run_number }}.

            * Windows — `PosterChan-Setup.exe` (Start-menu installer, auto-updates)
            * Linux — `PosterChan.AppImage` (auto-updates)
            * macOS — `PosterChan-arm64.dmg` / `PosterChan-x64.dmg` (unsigned: right-click → Open)

            Downloads: https://poster.place/desktop
          make_latest: false
          files: artifacts/*

      # THE GENTOO OVERLAY PINS A VERSION, AND A ROLLING TAG CANNOT HOLD ONE.
      #
      # app-misc/posterchan-desktop carries a Manifest, so portage needs the EXACT bytes it was
      # written against — and the step above deletes and re-creates `desktop-latest` on every build,
      # which takes every previously-versioned tarball with it. An overlay that verified on the day
      # it was published then 404s on the next desktop build: not a checksum failure, nothing to
      # download at all. It had gone stale that way three times (1.0.818, 1.0.825, 1.0.828) before
      # anybody checked, and each time `emerge posterchan-desktop` simply could not run.
      #
      # The immutable release above remains available even if one of these convenience installers
      # encounters a transient GitHub upload failure.
