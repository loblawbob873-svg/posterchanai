# PosterChanAI — pick ONE service via its profile:
#   docker compose --profile cpu   up -d --build   # ANY host (Linux/Windows/macOS)
#   docker compose --profile nostr up -d --build   # ANY host — Nostr-only (relay + client + Blossom, NO AI)
#   docker compose --profile cuda  up -d --build   # NVIDIA  (needs nvidia-container-toolkit; Windows = WSL2 only)
#   docker compose --profile rocm  up -d --build   # AMD     (needs host amdgpu driver) — LINUX ONLY
#   docker compose --profile intel up -d --build   # Intel Arc (needs host i915 + /dev/dri) — LINUX ONLY
#
# LINUX ONLY means it: `rocm` and `intel` pass through /dev/kfd and /dev/dri, which only exist on a
# Linux host with the amdgpu/i915 kernel driver loaded. Docker Desktop (Windows/macOS) runs containers
# in a VM that has no such devices, so those profiles fail at container-create with
#   Error response from daemon: error gathering device information while adding
#   custom device "/dev/kfd": no such file or directory
# That is a host capability, not a misconfiguration — on Windows/macOS use `cpu` or `nostr`.
# See docs/DOCKER.md for the full platform matrix.
#
# Each profile builds its OWN image tag (posterchanai:<TAG>-<backend>, e.g. ...-nostr / ...-cuda)
# so the profiles never alias one another — `--profile nostr up` always runs the lean nostr image,
# never a previously-built cuda one. All backends share the same data volume, so you can switch
# between them without losing your DB / models.

x-common: &common
  # NOTE: no shared `image:` here on purpose. Each backend service sets its OWN tag
  # (posterchanai:<tag>-<backend>) so the profiles can't alias one another. A single shared
  # tag made `--profile nostr up` (no --build) reuse whatever image was built last — e.g. a
  # CUDA build — so the lean nostr image silently "pulled in cuda".
  restart: unless-stopped
  # Let the entrypoint correct the system clock from NTP (date -s needs CAP_SYS_TIME). A wrong
  # clock silently empties the Nostr relay (its post queries are time-windowed). NOTE: containers
  # share the host kernel clock, so this sets the HOST's time too — fine for a dedicated node.
  cap_add:
    - SYS_TIME
  ports:
    - "${POSTERCHANAI_PORT:-3051}:3051"
    # Built-in Nostr relay (NIP-01). Only useful with POSTERCHANAI_NOSTR_RELAY=1 (binds 0.0.0.0).
    - "${POSTERCHANAI_NOSTR_RELAY_PORT:-3052}:3052"
    # Built-in TURN/STUN relay for voice/video calls (only used with POSTERCHANAI_TURN=1 + a public IP).
    # Also forward these on your router. Widen the relay UDP range for many concurrent relays.
    - "${POSTERCHANAI_TURN_PORT:-3478}:3478/udp"
    - "${POSTERCHANAI_TURN_PORT:-3478}:3478/tcp"
    - "49160-49200:49160-49200/udp"
    # Built-in MediaMTX media server for OBS streaming (only used with POSTERCHANAI_STREAM=1). Forward
    # 1935 (RTMP ingest) on your router; 8888 (HLS) only needed if you serve HLS on a direct subdomain.
    - "${POSTERCHANAI_STREAM_RTMP_PORT:-1935}:1935/tcp"
    - "${POSTERCHANAI_STREAM_HLS_PORT:-8888}:8888/tcp"
    # WebRTC/WHIP ingest — lets a phone go live from the browser. 8889 = WHIP signaling (proxied by the
    # app, so only needed for direct use); 8189/udp = WebRTC media (forward this for remote phones).
    - "${POSTERCHANAI_STREAM_WEBRTC_PORT:-8889}:8889/tcp"
    - "${POSTERCHANAI_STREAM_WEBRTC_UDP_PORT:-8189}:8189/udp"
    # Built-in GRASP git server (only used with POSTERCHANAI_GIT=1). Publish it only if git clients
    # hit the container directly; the usual setup fronts it with nginx `location /git/` and leaves
    # this port on the LAN. See docs/GIT.md.
    - "${POSTERCHANAI_GIT_PORT:-3053}:3053"
  environment:
    - POSTERCHANAI_PORT=3051
    # The web-of-trust relay is ON by default (it's the datastore + the web client's relay) and the
    # container binds it to 0.0.0.0 so the published 3052 above is actually reachable — a browser on a
    # plain `docker compose up` is handed ws://<host>:3052/relay. This flag only force-enables it on an
    # install that had turned it off. Front with TLS (e.g. nginx → wss://relay.yourdomain/). See docs/RELAY.md.
    - POSTERCHANAI_NOSTR_RELAY=${POSTERCHANAI_NOSTR_RELAY:-0}
    # Nostr-only deployment (no AI): hides the AI tab + AI compose actions in the web client.
    # The `nostr` profile/image already ships without the AI stack; this flag just tidies the UI.
    - POSTERCHANAI_NOSTR_ONLY=${POSTERCHANAI_NOSTR_ONLY:-0}
    # Turnkey Blossom media server (BUD-01/02): set POSTERCHANAI_BLOSSOM=1 and the app serves
    # Blossom at /blossom (same port as the app; front with TLS). Blobs default to the storage
    # server (proxy) and fall back to local on the data volume. See docs/BLOSSOM.md.
    - POSTERCHANAI_BLOSSOM=${POSTERCHANAI_BLOSSOM:-0}
    # Turnkey git server: set POSTERCHANAI_GIT=1 and the app enables the built-in git-over-nostr
    # host on :3053 (bound 0.0.0.0 so the published port is reachable). Set the public base URL too
    # or the clone URLs it hands out come back empty. Repos live on the data volume. See docs/GIT.md.
    - POSTERCHANAI_GIT=${POSTERCHANAI_GIT:-0}
    - POSTERCHANAI_GIT_PUBLIC_BASE=${POSTERCHANAI_GIT_PUBLIC_BASE:-}
    # Turnkey save-to-Blossom stream recording: set POSTERCHANAI_STREAM_RECORD=1 (needs POSTERCHANAI_STREAM=1).
    # Records to POSTERCHANAI_STREAM_RECORD_DIR (default /tmp/posterchanai-streams) then uploads to Blossom;
    # mount that path as tmpfs if you want it RAM-backed. Per-user opt-in still applies. See docs/STREAMING.md.
    - POSTERCHANAI_STREAM_RECORD=${POSTERCHANAI_STREAM_RECORD:-0}
    # Turnkey music: set POSTERCHANAI_MUSIC=1 (with `--profile music`) and the app auto-enables
    # music pointed at the acestep container — no manual Admin config needed.
    - POSTERCHANAI_MUSIC=${POSTERCHANAI_MUSIC:-0}
    - POSTERCHANAI_ACESTEP_URL=${POSTERCHANAI_ACESTEP_URL:-http://acestep:8001}
    # Turnkey video: set POSTERCHANAI_VIDEO=1 and the app auto-enables native text-to-video
    # (Wan2.1-1.3B by default; override with POSTERCHANAI_VIDEO_MODEL). Model auto-downloads to
    # the persisted HF cache on first use. Needs a GPU profile (cuda/rocm/intel).
    - POSTERCHANAI_VIDEO=${POSTERCHANAI_VIDEO:-0}
    - POSTERCHANAI_VIDEO_MODEL=${POSTERCHANAI_VIDEO_MODEL:-}
    # Turnkey voice/video calls: set POSTERCHANAI_TURN=1 + your PUBLIC IP and the app runs the built-in
    # TURN relay (the binary is baked into the image). Calls work P2P for most users without it; it's the
    # NAT fallback. Needs the ports above reachable (a grey-clouded turn.<domain> record is recommended).
    - POSTERCHANAI_TURN=${POSTERCHANAI_TURN:-0}
    - POSTERCHANAI_TURN_PUBLIC_IP=${POSTERCHANAI_TURN_PUBLIC_IP:-}
    - POSTERCHANAI_TURN_DOMAIN=${POSTERCHANAI_TURN_DOMAIN:-}
    # Turnkey OBS streaming: set POSTERCHANAI_STREAM=1 and the app runs the built-in MediaMTX media server
    # (binary baked into the image). Forward 1935 (RTMP). Set STREAM_DOMAIN to the host OBS pushes to.
    - POSTERCHANAI_STREAM=${POSTERCHANAI_STREAM:-0}
    - POSTERCHANAI_STREAM_DOMAIN=${POSTERCHANAI_STREAM_DOMAIN:-}
    # Postgres is the ONLY database — it backs both the app and the built-in Nostr relay (one DB).
    # Points at the `postgres` service below. Override POSTGRES_PASSWORD in a .env for production.
    - DATABASE_URL=postgresql+psycopg2://posterchan:${POSTGRES_PASSWORD:-posterchan_local}@postgres:5432/posterchan_relay
    - NOSTR_RELAY_PG_DSN=host=postgres port=5432 dbname=posterchan_relay user=posterchan password=${POSTGRES_PASSWORD:-posterchan_local}
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - pc-data:/var/lib/posterchanai
    - pc-rag:/app/data
    # Drop your own model files here: anything you put in the host ./models folder
    # shows up in the app's models dir. Point image_model_path / image_anime_model_path
    # at /var/lib/posterchanai/models/<your-file>.safetensors in Admin → Settings.
    # (The auto-downloaded LLM GGUF also lands here, so you can see/replace it.)
    - ./models:/var/lib/posterchanai/models
    # Per-user Debian SANDBOX (Admin → Services → node_exec_sandbox_enabled, OFF by default).
    # The app spawns SIBLING containers via docker-outside-of-docker. To enable it in Docker, uncomment
    # the socket mount below AND `group_add` below, AND build an image that has the docker CLI (the
    # stock image doesn't — see the note in the Dockerfile). Bare-metal installs use `./install.sh --sandbox`.
    #   - /var/run/docker.sock:/var/run/docker.sock

services:
  # The one and only database — backs the app AND the built-in Nostr relay. No profile, so it
  # starts under every GPU profile; the app services wait for its healthcheck (depends_on above).
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=posterchan
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-posterchan_local}
      - POSTGRES_DB=posterchan_relay
    volumes:
      # postgres:18+ stores data in a major-version subdir and wants the mount at
      # /var/lib/postgresql (NOT .../data, which it rejects as an "unused mount"). See
      # docker-library/postgres#1259. One mount here = clean pg_upgrade later.
      - pc-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posterchan -d posterchan_relay"]
      interval: 5s
      timeout: 5s
      retries: 20

  cpu:
    <<: *common
    profiles: ["cpu"]
    image: posterchanai:${TAG:-local}-cpu
    build:
      context: .
      args: { GPU: cpu }

  # Nostr-only: a self-hosted Nostr relay + the Nostr web client + Blossom, with NO AI stack
  # (no torch/llama/diffusers) — a small, fast image for people who don't care about AI. The relay
  # + nostr-only UI are turned ON by default here. Just:
  #   docker compose --profile nostr up -d --build
  nostr:
    <<: *common
    profiles: ["nostr"]
    image: posterchanai:${TAG:-local}-nostr
    build:
      context: .
      args:
        GPU: nostr
        INSTALL_BROWSER: "true"   # the `screenshot` command + nitter post-cards need headless Chrome,
                                  # and both are available in the nostr-only client — so install it here
                                  # (adds ~Chrome to the image, but otherwise screenshots silently fail)
    environment:
      - POSTERCHANAI_PORT=3051
      - POSTERCHANAI_NOSTR_RELAY=1
      - POSTERCHANAI_NOSTR_ONLY=1
      # Blossom is part of the nostr-only pitch (relay + client + Blossom) — ON by default here.
      # Public base URL auto-derives from the request (works out of the box on the LAN IP); set
      # blossom_public_url in Admin → Blossom to a real https domain in production.
      - POSTERCHANAI_BLOSSOM=${POSTERCHANAI_BLOSSOM:-1}
      - POSTERCHANAI_GIT=${POSTERCHANAI_GIT:-0}
      - POSTERCHANAI_GIT_PUBLIC_BASE=${POSTERCHANAI_GIT_PUBLIC_BASE:-}
      - DATABASE_URL=postgresql+psycopg2://posterchan:${POSTGRES_PASSWORD:-posterchan_local}@postgres:5432/posterchan_relay
      - NOSTR_RELAY_PG_DSN=host=postgres port=5432 dbname=posterchan_relay user=posterchan password=${POSTGRES_PASSWORD:-posterchan_local}

  cuda:
    <<: *common
    profiles: ["cuda"]
    image: posterchanai:${TAG:-local}-cuda
    build:
      context: .
      # BASE_IMAGE selects the CUDA toolkit base; passing it here (not via a base-* stage) means
      # only this profile ever references it, so cpu/nostr builds don't pull it.
      args: { GPU: cuda, BASE_IMAGE: "${CUDA_BASE:-nvidia/cuda:12.5.1-devel-ubuntu24.04}" }
    # Requires the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  rocm:
    <<: *common
    profiles: ["rocm"]
    image: posterchanai:${TAG:-local}-rocm
    build:
      context: .
      # ROCm builds on plain ubuntu:24.04 (the default BASE_IMAGE) and installs ROCm userspace in
      # the image. Override with a prebuilt rocm/dev-ubuntu-24.04:*-complete base if you prefer.
      args: { GPU: rocm, BASE_IMAGE: "${ROCM_BASE:-ubuntu:24.04}" }
    # ROCm userspace is in the image; the kernel driver comes from the host. The
    # container runs as root, so it reaches the render node without group juggling;
    # the entrypoint auto-sets HSA_OVERRIDE_GFX_VERSION for consumer RDNA cards.
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp:unconfined

  intel:
    <<: *common
    profiles: ["intel"]
    image: posterchanai:${TAG:-local}-intel
    build:
      context: .
      # oneAPI 2025.2+ base (2025.0's SYCL compiler makes the Arc emit EMPTY thinking/code gens).
      # Only this profile references it, so cpu/nostr builds never pull the heavy oneAPI image.
      args: { GPU: intel, BASE_IMAGE: "${INTEL_BASE:-intel/oneapi-basekit:2025.2.2-0-devel-ubuntu24.04}" }
    # Intel Arc: expose the render nodes; host needs the i915 driver.
    devices:
      - /dev/dri
    # Set SOURCE_ONEAPI=1 instead if you want GPU LLM (SYCL) rather than image gen.
    # NOTE: a service-level `environment:` REPLACES the x-common one (YAML merge doesn't deep-merge
    # lists), so every var this profile needs must be re-listed here — including DATABASE_URL /
    # NOSTR_RELAY_PG_DSN (or the app falls back to the wrong DB) and the turnkey POSTERCHANAI_*
    # flags — so intel behaves identically to cpu/cuda/rocm.
    environment:
      - POSTERCHANAI_PORT=3051
      - SOURCE_ONEAPI=0
      - POSTERCHANAI_MUSIC=${POSTERCHANAI_MUSIC:-0}
      - POSTERCHANAI_ACESTEP_URL=${POSTERCHANAI_ACESTEP_URL:-http://acestep:8001}
      - POSTERCHANAI_VIDEO=${POSTERCHANAI_VIDEO:-0}
      - POSTERCHANAI_VIDEO_MODEL=${POSTERCHANAI_VIDEO_MODEL:-}
      - POSTERCHANAI_NOSTR_RELAY=${POSTERCHANAI_NOSTR_RELAY:-0}
      - POSTERCHANAI_NOSTR_ONLY=${POSTERCHANAI_NOSTR_ONLY:-0}
      - POSTERCHANAI_BLOSSOM=${POSTERCHANAI_BLOSSOM:-0}
      - POSTERCHANAI_GIT=${POSTERCHANAI_GIT:-0}
      - POSTERCHANAI_GIT_PUBLIC_BASE=${POSTERCHANAI_GIT_PUBLIC_BASE:-}
      - DATABASE_URL=postgresql+psycopg2://posterchan:${POSTGRES_PASSWORD:-posterchan_local}@postgres:5432/posterchan_relay
      - NOSTR_RELAY_PG_DSN=host=postgres port=5432 dbname=posterchan_relay user=posterchan password=${POSTGRES_PASSWORD:-posterchan_local}

  # Optional ACE-Step music server (the `musicgeni` command). Runs as its OWN service because
  # ACE-Step needs Python 3.11–3.12 and a conflicting dependency stack; the app talks to it over
  # HTTP. TURNKEY — one command auto-enables music + points the app at this container:
  #   POSTERCHANAI_MUSIC=1 docker compose --profile cuda --profile music up -d --build
  # (POSTERCHANAI_MUSIC=1 makes the app seed music_enabled + music_api_base=http://acestep:8001 on
  # startup; without it you can still enable music manually in Admin → Music.)
  # NVIDIA only (needs nvidia-container-toolkit on the host); the turbo model fits a 12 GB GPU and
  # auto-downloads on first request into the pc-acestep volume (first song is slower). Pin a repo
  # ref with ACESTEP_REF if upstream changes.
  acestep:
    profiles: ["music"]
    image: posterchanai-acestep:${TAG:-local}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.acestep
      args:
        ACESTEP_REF: ${ACESTEP_REF:-main}
    ports:
      - "${ACESTEP_PORT:-8001}:8001"
    volumes:
      - pc-acestep:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  # AMD/ROCm music. Same as `acestep` but builds the ROCm torch trio (TORCH_INDEX) and passes the
  # render nodes through instead of using the nvidia runtime. The `acestep` network alias means the
  # app still reaches it at the default http://acestep:8001 — no URL change needed. TURNKEY:
  #   POSTERCHANAI_MUSIC=1 docker compose --profile rocm --profile music-rocm up -d --build
  acestep-rocm:
    profiles: ["music-rocm"]
    image: posterchanai-acestep:${TAG:-local}-rocm
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.acestep
      args:
        ACESTEP_REF: ${ACESTEP_REF:-main}
        TORCH_INDEX: ${ACESTEP_TORCH_INDEX:-https://download.pytorch.org/whl/rocm6.3}
    ports:
      - "${ACESTEP_PORT:-8001}:8001"
    volumes:
      - pc-acestep:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp:unconfined
    networks:
      default:
        aliases: [acestep]

  # Intel Arc/XPU music. Builds the XPU torch trio and exposes only /dev/dri. Same `acestep` alias.
  #   POSTERCHANAI_MUSIC=1 docker compose --profile intel --profile music-intel up -d --build
  acestep-intel:
    profiles: ["music-intel"]
    image: posterchanai-acestep:${TAG:-local}-xpu
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.acestep
      args:
        ACESTEP_REF: ${ACESTEP_REF:-main}
        TORCH_INDEX: ${ACESTEP_TORCH_INDEX:-https://download.pytorch.org/whl/xpu}
    ports:
      - "${ACESTEP_PORT:-8001}:8001"
    volumes:
      - pc-acestep:/root/.cache/huggingface
    devices:
      - /dev/dri
    networks:
      default:
        aliases: [acestep]

volumes:
  pc-data:
  pc-rag:  # legacy name; mounts /app/data (uploads, generated media)
  pc-acestep:
  pc-pg:   # PostgreSQL data (app + Nostr relay)
