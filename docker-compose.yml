# PosterChanAI — pick ONE service via its profile:
#   docker compose --profile cpu   up -d --build
#   docker compose --profile cuda  up -d --build   # NVIDIA  (needs nvidia-container-toolkit)
#   docker compose --profile rocm  up -d --build   # AMD     (needs host amdgpu driver)
#   docker compose --profile intel up -d --build   # Intel Arc (needs host i915 + /dev/dri)
#
# All four share the same data volume so you can switch backends without losing
# your DB / models / RAG store.

x-common: &common
  image: posterchanai:${TAG:-local}
  restart: unless-stopped
  ports:
    - "${POSTERCHANAI_PORT:-3051}:3051"
  environment:
    - POSTERCHANAI_PORT=3051
  volumes:
    - pc-data:/var/lib/posterchanai
    - pc-rag:/app/data
    # Drop your own model files here: anything you put in the host ./models folder
    # shows up in the app's models dir. Point image_model_path / image_anime_model_path
    # at /var/lib/posterchanai/models/<your-file>.safetensors in Admin → Settings.
    # (The auto-downloaded LLM GGUF also lands here, so you can see/replace it.)
    - ./models:/var/lib/posterchanai/models

services:
  cpu:
    <<: *common
    profiles: ["cpu"]
    build:
      context: .
      args: { GPU: cpu }

  cuda:
    <<: *common
    profiles: ["cuda"]
    build:
      context: .
      args: { GPU: cuda }
    # Requires the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  rocm:
    <<: *common
    profiles: ["rocm"]
    build:
      context: .
      args: { GPU: rocm }
    # ROCm userspace is in the image; the kernel driver comes from the host. The
    # container runs as root, so it reaches the render node without group juggling;
    # the entrypoint auto-sets HSA_OVERRIDE_GFX_VERSION for consumer RDNA cards.
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp:unconfined

  intel:
    <<: *common
    profiles: ["intel"]
    build:
      context: .
      args: { GPU: intel }
    # Intel Arc: expose the render nodes; host needs the i915 driver.
    devices:
      - /dev/dri
    # Set SOURCE_ONEAPI=1 instead if you want GPU LLM (SYCL) rather than image gen.
    environment:
      - POSTERCHANAI_PORT=3051
      - SOURCE_ONEAPI=0

  # Optional ACE-Step music server (the `musicgeni` command). Runs as its OWN service because
  # ACE-Step needs Python 3.11–3.12 and a conflicting dependency stack; the app talks to it over
  # HTTP. Opt in by ADDING the `music` profile to any backend profile, e.g.:
  #   docker compose --profile cuda --profile music up -d --build
  # Then in Admin → Music: enable music and set the Local Server URL to http://acestep:8001.
  # NVIDIA only (needs nvidia-container-toolkit on the host); the turbo model fits a 12 GB GPU and
  # auto-downloads on first request into the pc-acestep volume (first song is slower). Pin a repo
  # ref with ACESTEP_REF if upstream changes.
  acestep:
    profiles: ["music"]
    image: posterchanai-acestep:${TAG:-local}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.acestep
      args:
        ACESTEP_REF: ${ACESTEP_REF:-main}
    ports:
      - "${ACESTEP_PORT:-8001}:8001"
    volumes:
      - pc-acestep:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

volumes:
  pc-data:
  pc-rag:
  pc-acestep:
