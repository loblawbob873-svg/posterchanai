<!-- RAG Modal -->
<div class="modal" id="ragModal" style="display: none; align-items: center !important; justify-content: center !important;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>RAG Context</h2>
            <button class="btn-icon modal-close modal-close-cyberpunk" id="closeRagModal">✕</button>
        </div>
        <div class="modal-body">
            <p class="modal-info">Select collections to include code context in your chat.</p>

            <div class="rag-toggle-section">
                <label class="toggle-row">
                    <span>Enable RAG Context</span>
                    <input type="checkbox" id="ragContextEnabled">
                </label>
            </div>

            <div class="rag-collections-section" id="ragCollectionsSection">
                <h4>Your Collections</h4>
                <div id="ragUserCollections" class="rag-collection-checkboxes">
                    <!-- Collections loaded here -->
                </div>
            </div>

            <!-- Upload Section -->
            <div class="rag-upload-section">
                <h4>Upload New Collection</h4>
                <div class="settings-form">
                    <label for="ragUploadName">Collection Name</label>
                    <input type="text" id="ragUploadName" placeholder="My Project">
                    <label for="ragUploadPatterns">File Types</label>
                    <input type="text" id="ragUploadPatterns" value="*.py,*.js,*.ts,*.md,*.txt">
                    <label class="upload-dropzone" id="ragDropzone" style="margin-top: 10px;">
                        <input type="file" id="ragUploadFile" accept=".zip" style="display: none;">
                        <span class="dropzone-text">Click or drag zip file here</span>
                        <span class="dropzone-filename" id="ragFileName"></span>
                    </label>
                    <button class="btn-primary" id="ragUploadBtn" disabled style="margin-top: 10px;">Upload & Index</button>
                    <div id="ragUploadStatus" class="settings-status"></div>
                </div>
            </div>

            <div class="rag-status-section">
                <div class="rag-status-item">
                    <span>Model:</span>
                    <span id="ragStatusModel">-</span>
                </div>
                <div class="rag-status-item">
                    <span>Total Documents:</span>
                    <span id="ragStatusDocs">-</span>
                </div>
            </div>

            <div class="rag-actions">
                <button class="btn-primary" id="saveRagSettings">Save Settings</button>
            </div>
        </div>
    </div>
</div>
