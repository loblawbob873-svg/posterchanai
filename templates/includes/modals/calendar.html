<!-- Calendar Event Modal -->
<div class="modal" id="calendarModal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="calendarModalTitle">Add Event</h2>
            <button class="btn-icon modal-close" id="closeCalendarModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="settings-form">
                <label for="eventTitle">Title *</label>
                <input type="text" id="eventTitle" placeholder="Event title" required>

                <label for="eventDate">Date *</label>
                <input type="date" id="eventDate" required>

                <label for="eventTime">Start Time</label>
                <input type="time" id="eventTime" placeholder="09:00">

                <label for="eventEndTime">End Time</label>
                <input type="time" id="eventEndTime">

                <label for="eventLocation">Location</label>
                <input type="text" id="eventLocation" placeholder="Location (optional)">

                <label for="eventDescription">Description</label>
                <textarea id="eventDescription" rows="3" placeholder="Description (optional)"></textarea>

                <label for="eventRecurrence">Repeat</label>
                <input type="text" id="eventRecurrence" placeholder="daily, weekly Mon Wed Fri, monthly" list="recurrenceOptions">
                <datalist id="recurrenceOptions">
                    <option value="daily">
                    <option value="weekly">
                    <option value="weekly Mon Wed Fri">
                    <option value="monthly">
                </datalist>

                <input type="hidden" id="eventUid" value="">

                <div class="modal-buttons">
                    <button class="btn-primary" id="saveEventBtn">Save Event</button>
                    <button class="btn-secondary" id="cancelEventBtn">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
