<!-- Translate Modal -->
<div class="modal" id="translateModal" style="display: none; align-items: center !important; justify-content: center !important;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Translate Document</h2>
            <button class="btn-icon modal-close modal-close-cyberpunk" id="closeTranslateModal">✕</button>
        </div>
        <div class="modal-body">
            <p class="modal-info">Upload a file or image to translate its contents.</p>
            <div class="settings-form">
                <label for="targetLanguage">Translate To</label>
                <input type="text" id="targetLanguage" list="languageList" placeholder="Type language..." autocomplete="off">
                <datalist id="languageList">
                    <option value="English">
                    <option value="Spanish">
                    <option value="French">
                    <option value="German">
                    <option value="Italian">
                    <option value="Portuguese">
                    <option value="Russian">
                    <option value="Japanese">
                    <option value="Korean">
                    <option value="Chinese (Simplified)">
                    <option value="Chinese (Traditional)">
                    <option value="Arabic">
                    <option value="Hindi">
                    <option value="Dutch">
                    <option value="Polish">
                    <option value="Vietnamese">
                    <option value="Thai">
                    <option value="Turkish">
                    <option value="Hebrew">
                    <option value="Greek">
                    <option value="Swedish">
                    <option value="Norwegian">
                    <option value="Danish">
                    <option value="Finnish">
                    <option value="Czech">
                    <option value="Hungarian">
                    <option value="Romanian">
                    <option value="Ukrainian">
                    <option value="Indonesian">
                    <option value="Malay">
                    <option value="Tagalog">
                    <option value="Swahili">
                </datalist>
                <label class="btn-primary translate-upload-btn">
                    Choose File to Translate
                    <input type="file" id="translateFileInput" accept="image/*,.heic,.heif,.pdf,.txt,.md,.docx" style="display: none;">
                </label>
                <div id="translateFileName" class="translate-file-name"></div>
            </div>
        </div>
    </div>
</div>
