<!-- News Modal -->
<div class="modal" id="newsModal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>News Summary</h2>
            <button class="btn-icon modal-close" id="closeNewsModal">&times;</button>
        </div>
        <div class="modal-body">
            <p class="modal-info">Select a news source to get today's headlines summary.</p>
            <div class="news-sources">
                <button class="news-source-btn" data-url="drudgereport.com">Drudge Report</button>
                <button class="news-source-btn" data-url="npr.org/sections/news">NPR</button>
                <button class="news-source-btn" data-url="nypost.com">NY Post</button>
                <button class="news-source-btn" data-url="foxnews.com">Fox News</button>
            </div>
        </div>
    </div>
</div>
