<!-- 4chan Catalog Browser Modal -->
<div class="modal fourchan-modal" id="fourchanOverlay" style="display: none;">
    <div class="modal-content fourchan-modal-content">
        <div class="modal-header fourchan-header">
            <h2>📋 4chan Catalog</h2>
            <div class="fourchan-board-tabs">
                <button type="button" class="fourchan-tab active" data-board="g">/g/</button>
                <button type="button" class="fourchan-tab" data-board="pol">/pol/</button>
            </div>
            <button type="button" class="btn-icon modal-close" id="fourchanCloseBtn" title="Close">✕</button>
        </div>
        <div class="fourchan-body">
            <div class="fourchan-loading" id="fourchanLoading" style="display: none;">Loading catalog...</div>
            <div class="fourchan-grid" id="fourchanGrid"></div>
        </div>
    </div>
</div>

<!-- 4chan Thread Viewer Modal -->
<div class="modal fourchan-modal" id="fourchanThreadOverlay" style="display: none;">
    <div class="modal-content fourchan-thread-modal-content">
        <div class="modal-header fourchan-thread-header">
            <h2 id="fourchanThreadTitle">Thread</h2>
            <div class="fourchan-thread-actions">
                <a id="fourchanThreadOpenLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-secondary btn-small">Open on 4chan</a>
                <button type="button" class="btn-primary btn-small" id="fourchanSummarizeBtn">Summarize</button>
            </div>
            <button type="button" class="btn-icon modal-close" id="fourchanThreadCloseBtn" title="Close">✕</button>
        </div>
        <div class="fourchan-thread-body">
            <div class="fourchan-thread-loading" id="fourchanThreadLoading" style="display: none;">Loading thread...</div>
            <div class="fourchan-thread-posts" id="fourchanThreadPosts"></div>
            <div class="fourchan-thread-summary-section" id="fourchanThreadSummarySection" style="display: none;">
                <h4>Summary</h4>
                <div class="fourchan-thread-summary" id="fourchanThreadSummary"></div>
            </div>
        </div>
    </div>
</div>

<!-- 4chan full-size image/video overlay (opens when clicking a thread image or video) -->
<div class="fourchan-image-overlay" id="fourchanImageOverlay" style="display: none;">
    <button type="button" class="fourchan-image-overlay-close" id="fourchanImageOverlayClose" title="Close">✕</button>
    <div class="fourchan-image-overlay-content">
        <img id="fourchanImageOverlayImg" src="" alt="" style="display: none;">
        <video id="fourchanImageOverlayVideo" controls preload="metadata" style="display: none;"></video>
    </div>
</div>
