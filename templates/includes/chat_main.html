<!-- Main Chat Area -->
<main class="chat-main">
    <header class="chat-header">
        <button class="btn-icon mobile-menu" id="menuBtn">☰</button>
        <div class="chat-title" id="chatTitle">Select a chat or start a new one</div>
        <div class="header-actions">
            <button class="btn-icon tts-toggle" id="ttsToggle" title="Toggle TTS">🔊</button>
            <button class="btn-icon" id="deleteChatBtn" title="Delete Chat">🗑️</button>
        </div>
    </header>

    <div class="mascot-section" id="mascotSection">
        <div class="mascot-container">
            <img src="/static/mascot/mascot-neutral-front-00.png" alt="Mascot" class="mascot-image" id="mascotImage">
            <div class="speech-bubble" id="speechBubble"></div>
        </div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="messages-container" id="messagesContainer">
        <div class="messages" id="messages"></div>
    </div>

    <div class="quick-actions" id="quickActions">
        <button class="quick-btn mode-btn active" data-mode="">💬 Chat</button>
        <button class="quick-btn" data-cmd="pins">📌 Pins</button>
        <div class="quick-btn-dropdown">
            <button class="quick-btn dropdown-toggle" id="pimDropdownBtn">📋 PIM ▾</button>
            <div class="dropdown-menu" id="pimDropdownMenu">
                <button class="dropdown-item cmd-item" data-cmd="mail">📧 Mail</button>
                <button class="dropdown-item cmd-item" data-cmd="mail folders">📬 Mail Folders</button>
                <button class="dropdown-item cmd-item" data-cmd="reminders">⏰ Reminders</button>
            </div>
        </div>
        <div class="quick-btn-dropdown">
            <button class="quick-btn dropdown-toggle" id="filesDropdownBtn">📁 Files ▾</button>
            <div class="dropdown-menu" id="filesDropdownMenu">
                <button class="dropdown-item" id="fileManagerBtn" title="File Manager" onclick="if(window.fileManager){window.fileManager.open();}else{console.error('FileManager not initialized');}">📁 File Manager</button>
                <button class="dropdown-item" id="photoGalleryBtn" title="Photo Gallery" onclick="openPhotoGalleryNow();">🖼️ Photos</button>
            </div>
        </div>
<script>
function openPhotoGalleryNow() {
    var v = document.getElementById('cyberpunkPictureViewer');
    if (!v) { alert('Photo viewer not found'); return; }
    
    // Move to body
    if (v.parentElement !== document.body) {
        document.body.appendChild(v);
    }
    
    // Show with high z-index
    v.style.display = 'block';
    v.style.position = 'fixed';
    v.style.top = '0';
    v.style.left = '0';
    v.style.right = '0';
    v.style.bottom = '0';
    v.style.zIndex = '999999';
    
    // Fix overlay - make it a background, not blocking
    var overlay = v.querySelector('.cyberpunk-viewer-overlay');
    if (overlay) {
        overlay.style.zIndex = '-1';
    }
    
    // Fix container - must be above overlay
    var container = v.querySelector('.cyberpunk-viewer-container');
    if (container) {
        container.style.position = 'relative';
        container.style.zIndex = '1';
        container.style.width = '100%';
        container.style.height = '100%';
        container.style.display = 'flex';
        container.style.flexDirection = 'column';
    }
    
    // Setup close button
    var closeBtn = document.getElementById('pictureViewerCloseBtn');
    if (closeBtn) {
        closeBtn.onclick = function() {
            v.style.display = 'none';
            if (window.fileManager) window.fileManager.pictureViewerOpen = false;
        };
    }
    
    // Load images
    if (window.fileManager) {
        window.fileManager.pictureViewerOpen = true;
        if (window.fileManager.loadAllImages) window.fileManager.loadAllImages();
        if (window.fileManager.setupInfiniteScroll) window.fileManager.setupInfiniteScroll();
    }
}
</script>
        <div class="quick-btn-dropdown">
            <button class="quick-btn dropdown-toggle" id="searchDropdownBtn">🌐 Web ▾</button>
            <div class="dropdown-menu" id="searchDropdownMenu">
                <button class="dropdown-item mode-btn" data-mode="search">🔍 Web Search</button>
                <button class="dropdown-item mode-btn" data-mode="images">🖼️ Images</button>
                <button class="dropdown-item" id="newsDropdownBtn">📰 News</button>
                <button class="dropdown-item cmd-item" data-cmd="torrents">🧲 Torrents</button>
                <button class="dropdown-item cmd-item" data-cmd="torrents list">⬇️ Downloading</button>
                <button class="dropdown-item cmd-item" data-cmd="nyaa">🐱 Nyaa</button>
            </div>
        </div>
        <div class="quick-btn-dropdown">
            <button class="quick-btn dropdown-toggle" id="generateDropdownBtn">✨ Generate ▾</button>
            <div class="dropdown-menu" id="generateDropdownMenu">
                <button class="dropdown-item mode-btn" data-mode="geni">🖼️ Image</button>
                <button class="dropdown-item mode-btn" data-mode="musicgeni">🎵 Music</button>
                <button class="dropdown-item mode-btn" data-mode="videogeni">🎬 Video</button>
            </div>
        </div>
        <button class="quick-btn" id="translateBtn">🌍 Translate</button>
    </div>

    <div class="input-area">
        <div class="upload-preview" id="uploadPreview" style="display: none;">
            <div id="attachmentsList" class="attachments-list"></div>
            <button class="btn-icon remove-upload" id="removeUpload">×</button>
        </div>
        <div id="linkActions" style="display:none;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:6px 8px;"></div>
        <div class="input-row">
            <label class="btn-icon upload-btn" title="Attach file or image">
                📎
                <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.pdf,video/*,.mp4,.mov,.mkv,.webm,.m4v,.txt,.py,.js,.ts,.json,.md,.csv,.html,.css,.docx,.xlsx,.pptx" style="display: none;">
            </label>
            <label class="btn-icon camera-btn" title="Take photo">
                📷
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            </label>
            <button type="button" class="btn-icon voice-input-btn" id="voiceInputBtn" title="Voice input (click to speak)">
                🎤
            </button>
            <textarea id="messageInput" placeholder="Type a message or command..." rows="1"></textarea>
            <button class="btn-send" id="sendBtn">📤 Send</button>
        </div>
    </div>
</main>
