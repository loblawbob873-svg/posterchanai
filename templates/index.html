{% extends "base.html" %}

{% block title %}Chat - Poster-chan AI{% endblock %}

{% block content %}
<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Chats</h2>
            <button class="btn-icon" id="newChatBtn" title="New Chat">+</button>
        </div>
        <div class="conversation-list" id="conversationList">
            <!-- Conversations loaded here -->
        </div>
        <div class="sidebar-footer">
            <div class="user-menu-container">
                <button class="user-menu-btn" id="userMenuBtn">
                    <span class="user-icon">{{ user.username[0].upper() }}</span>
                    <span class="user-name">{{ user.username }}</span>
                    <span class="menu-arrow">&#9662;</span>
                </button>
                <div class="user-menu" id="userMenu">
                    <button class="menu-item" id="apiKeysBtn">
                        <span class="menu-icon">🔑</span> API Keys
                    </button>
                    {% if user.is_admin %}
                    <a href="/admin" class="menu-item">
                        <span class="menu-icon">⚙️</span> Admin Panel
                    </a>
                    {% endif %}
                    <div class="menu-divider"></div>
                    <button class="menu-item text-danger" id="deleteAllBtn">
                        <span class="menu-icon">🗑️</span> Delete All Chats
                    </button>
                    <button class="menu-item" id="logoutBtn">
                        <span class="menu-icon">🚪</span> Logout
                    </button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main">
        <!-- Header -->
        <header class="chat-header">
            <button class="btn-icon mobile-menu" id="menuBtn">☰</button>
            <div class="chat-title" id="chatTitle">Select a chat or start a new one</div>
            <div class="header-actions">
                <button class="btn-icon tts-toggle" id="ttsToggle" title="Toggle TTS">🔊</button>
                <button class="btn-icon" id="deleteChatBtn" title="Delete Chat">🗑️</button>
            </div>
        </header>

        <!-- Mascot Section -->
        <div class="mascot-section" id="mascotSection">
            <div class="mascot-container">
                <img src="/static/mascot/mascot-neutral-front-00.png" alt="Mascot" class="mascot-image" id="mascotImage">
                <div class="speech-bubble" id="speechBubble"></div>
            </div>
            <div class="particles" id="particles"></div>
        </div>

        <!-- Messages -->
        <div class="messages-container" id="messagesContainer">
            <div class="messages" id="messages">
                <!-- Messages loaded here -->
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions" id="quickActions">
            <button class="quick-btn mode-btn active" data-mode="">Chat</button>
            <button class="quick-btn mode-btn" data-mode="search">Search</button>
            <button class="quick-btn mode-btn" data-mode="images">Images</button>
            <button class="quick-btn mode-btn" data-mode="geni">Generate</button>
            <button class="quick-btn mode-btn" data-mode="img2img">Img2Img</button>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="upload-preview" id="uploadPreview" style="display: none;">
                <img id="imagePreview" alt="Preview">
                <div id="filePreview"></div>
                <button class="btn-icon remove-upload" id="removeUpload">×</button>
            </div>
            <div class="input-row">
                <label class="btn-icon upload-btn" title="Attach file or image">
                    📎
                    <input type="file" id="fileInput" accept="image/*,.txt,.py,.js,.ts,.json,.md,.csv,.html,.css" style="display: none;">
                </label>
                <textarea id="messageInput" placeholder="Type a message or command..." rows="1"></textarea>
                <button class="btn-send" id="sendBtn">Send</button>
            </div>
        </div>
    </main>
</div>

<!-- API Keys Modal -->
<div class="modal" id="apiKeysModal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>API Keys</h2>
            <button class="btn-icon modal-close" id="closeApiKeysModal">&times;</button>
        </div>
        <div class="modal-body">
            <p class="modal-info">API keys allow external applications to access the AI API.</p>
            <div class="api-key-form">
                <input type="text" id="newKeyName" placeholder="Key name (optional)">
                <button class="btn-primary" id="createApiKey">Generate New Key</button>
            </div>
            <div class="api-key-list" id="apiKeyList">
                <!-- Keys loaded here -->
            </div>
        </div>
    </div>
</div>

<script src="/static/js/mascot.js"></script>
<script src="/static/js/tts.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/apikeys.js"></script>
{% endblock %}
