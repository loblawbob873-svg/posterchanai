<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Poster-chan AI">
    <meta name="application-name" content="Poster-chan AI">
    <meta name="msapplication-TileColor" content="#1a1a2e">
    <meta name="msapplication-TileImage" content="/static/icon-192.png">
    <title>{% block title %}Poster-chan AI{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ cache_bust|default('28') }}">
        <link rel="stylesheet" href="/static/css/modules/components.css?v=19">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- CSRF protection - must load before other scripts (CSRF disabled) -->
    <script src="/static/js/modules/csrf.js?v=5"></script>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
    <script>
        // IMPORTANT: only manage service workers when this page is the TOP-LEVEL document. The /client
        // Nostr PWA preloads /admin in a HIDDEN IFRAME — and getRegistrations()+unregister() below would
        // otherwise nuke EVERY service worker for the origin, INCLUDING the /client PWA's own SW. That
        // forced the PWA to reload (controllerchange handler), which on Firefox re-reveals the browser
        // toolbar and made cached code "stick". Embedded in an iframe → do nothing.
        if ('serviceWorker' in navigator && window.self === window.top) {
            // Register (or refresh) OUR root worker — and nothing else.
            //
            // There used to be a getRegistrations()+unregister() sweep here, and it was far more
            // destructive than it looked: getRegistrations() returns EVERY scope on the origin, so each
            // top-level visit to / or /admin unregistered the /client Nostr PWA's service worker too,
            // taking its offline shell and its media cache with it. The iframe guard above was added when
            // that was noticed from the embedded-/admin direction; the plain top-level tab does exactly
            // the same damage. Re-registering the same scope already replaces the previous worker, which
            // is the only thing the sweep was ever needed for.
            //
            // updateViaCache:'none' fetches sw.js from the network on each check, so the ?v= bump can't be
            // pinned for up to 24h by the HTTP cache.
            navigator.serviceWorker.register('/sw.js?v=22', { scope: '/', updateViaCache: 'none' }).catch(() => {});
        }
    </script>
</body>
</html>
