<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Poster-chan AI">
    <meta name="application-name" content="Poster-chan AI">
    <meta name="msapplication-TileColor" content="#1a1a2e">
    <meta name="msapplication-TileImage" content="/static/icon-192.png">
    <title>{% block title %}Poster-chan AI{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
        <link rel="stylesheet" href="/static/css/modules/components.css?v=8">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- CSRF protection - must load before other scripts (CSRF disabled) -->
    <script src="/static/js/modules/csrf.js?v=5"></script>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
    <script>
        if ('serviceWorker' in navigator) {
            // Unregister old service workers first
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
            // Register new service worker with cache-busting version
                    navigator.serviceWorker.register('/sw.js?v=13', { scope: '/' }).catch(() => {});
        }
    </script>
</body>
</html>
