<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Media Center</title><link rel="stylesheet" href="/static/css/media_center_app.css?v=5"></head>
<body><header><button id="back" aria-label="Back to libraries">←</button><h1>Media Center</h1><button id="logout" hidden>Disconnect</button></header><main><p id="status" role="status">Connecting…</p><section id="connect" hidden><h2>Connect this app</h2><p>In Posterchan, open <strong>Media Center → Menu → Connect an app</strong> and approve this code.</p><output id="code" aria-live="polite"></output><button id="new-code">New code</button></section><section id="player" hidden><h2 id="playing"></h2><video controls playsinline preload="metadata"></video><div class="controls"><label>Audio <select id="audio"></select></label><label>Subtitles <select id="subtitles"></select></label><button id="fullscreen">Full screen</button><button id="stop">Close player</button></div><p id="subtitle-status" role="status"></p></section><section id="library" hidden><label class="search">Search <input id="search" type="search" placeholder="Search your libraries" autocomplete="off"></label><nav id="breadcrumbs" aria-label="Library path"></nav><h2 id="heading">Your libraries</h2><div id="cards"></div><button id="more" hidden>Load more</button></section></main><dialog id="resume-dialog"><form method="dialog"><h2 id="resume-title"></h2><p>Continue from <strong id="resume-time"></strong>?</p><div class="controls"><button value="resume">Resume</button><button value="start">Start from beginning</button><button value="cancel">Cancel</button></div></form></dialog><script src="/static/vendor/hls/hls.min.js"></script><script src="/jellyfin/main.posterchan.bundle.js"></script></body></html>
