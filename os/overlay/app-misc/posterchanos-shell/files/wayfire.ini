# PosterChanOS staged Wayfire session. Sway is the default until native-window IPC has a Wayfire
# backend. Select this session by writing `wayfire` to ~/.config/posterchanos/compositor; deleting
# that file rolls back to Sway. pc-compositor-session also falls back automatically after a crash.

[core]
xwayland = true
preferred_decoration_mode = client
plugins = animate autostart command decoration fast-switcher foreign-toplevel grid idle ipc ipc-rules move place resize switcher vswitch window-rules wm-actions

[autostart]
environment = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE; dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
portal = systemctl --user try-restart xdg-desktop-portal xdg-desktop-portal-wlr
shell = /usr/local/bin/pc-shell-start-wayfire

[input]
click_method = default
cursor_speed = 0.0

[decoration]
border_size = 3
active_color = \#241438ff
inactive_color = \#171222ff
ignore_views = app_id is "posterchan-desktop" | app_id is "PosterChan" | app_id is "place.poster.desktop" | title startswith "PosterChan Window"

[move]
activate = <super> BTN_LEFT
# Wayfire performs the final native geometry; PosterChanUI continues to own the preview. Disabling
# timed workspace switching is essential at monitor seams, where a drag must stay on the real output.
enable_snap = true
snap_threshold = 10
quarter_snap_threshold = 50
enable_snap_off = true
snap_off_threshold = 10
workspace_switch_after = -1

[resize]
activate = <super> BTN_RIGHT

[command]
binding_start = KEY_LEFTMETA
command_start = /usr/local/bin/pc-wayfire-action pc:start
binding_terminal = <alt> KEY_ENTER
command_terminal = /usr/local/bin/pc-wayfire-action pc:terminal
binding_tasks = <ctrl> <alt> KEY_DELETE
command_tasks = /usr/local/bin/pc-wayfire-action pc:tasks
binding_screenshot_region = KEY_SYSRQ
command_screenshot_region = /usr/local/bin/pc-screenshot region
binding_screenshot_screen = <shift> KEY_SYSRQ
command_screenshot_screen = /usr/local/bin/pc-screenshot screen
binding_recovery_terminal = <super> <shift> KEY_ENTER
command_recovery_terminal = foot
binding_shell_restart = <ctrl> <alt> KEY_BACKSPACE
command_shell_restart = /usr/local/bin/pc-shell-restart
binding_close = <alt> KEY_F4
command_close = /usr/local/bin/pc-wayfire-action pc:close

[idle]
dpms_timeout = 120
disable_on_fullscreen = true

[window-rules]
rule_1 = on created if app_id is "posterchan-desktop" then maximize
rule_2 = on created if app_id is "PosterChan" then maximize
