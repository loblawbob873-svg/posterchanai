# The PosterChanOS session. Wayfire is the only compositor: Sway, its config and its fallback were
# removed once the desktop's native-window bridge spoke Wayfire IPC. pc-compositor-session starts
# this and, if it cannot, leaves a text console saying why rather than quietly starting something
# else. Portage owns this file — an `etc-update --automode -5` replaces a hand-edited one.

[core]
xwayland = true
preferred_decoration_mode = server
# `switcher` is deliberately absent. It claims <alt>Tab, and every PosterChan window on a monitor
# lives inside ONE compositor toplevel -- so the compositor's own switcher can only ever offer "the
# desktop" and whatever native applications are open, never Messages, Terminal, Code or Files. The
# chord belongs to pc-window-cycle below, which cycles the renderer's frames AND its adopted native
# surfaces. `fast-switcher` stays as the way back to a native window if the shell is wedged, on
# Super+Alt+Esc -- see [fast-switcher] for why not its default Alt+Esc.
plugins = animate autostart command decoration fast-switcher force-fullscreen foreign-toplevel grid idle ipc ipc-rules posterchan-shell move place resize view-shot vswitch window-rules wm-actions
# `view-shot` IS WHAT MAKES ALT+TAB SHOW PICTURES OF WINDOWS RATHER THAN OF THE DESKTOP.
#
# The chooser used to be filled by `grim -g <rect>`, which photographs a SCREEN RECTANGLE: a
# window that is covered photographs as whatever covers it, so the capture path had to refuse
# any window overlapping another. On this compositor the desktop shell is an opaque full-output
# surface that every focus raises, so "covered" is nearly every window and the photograph is
# nearly always the wallpaper -- "alt_tab are all blank previews". view-shot renders the VIEW.
# Measured against a window sitting under both the shell and a fullscreen game: a 1942x1529 PNG
# of that window's real contents. desktop/wm-wayfire.js falls back to grim where it is absent.

[autostart]
environment = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE; dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
portal = systemctl --user try-restart xdg-desktop-portal xdg-desktop-portal-wlr
shell = /usr/local/bin/pc-shell-start-wayfire
idle_watch = /usr/local/bin/pc-idle
# The compositor reads /etc/wayfire.ini, which portage owns; the person's own answer to
# "keep the mouse in a fullscreen game" lives in their home directory. Applied here, once,
# the same way pc-idle carries Settings -> Power to the idle plugin.
pointer_confine = /usr/local/bin/pc-pointer-confine apply
# THERE IS NO NOTIFICATION DAEMON HERE, AND THAT IS A DECISION.
#
# `pc:host:notify` is Electron's Notification API, which on Linux is libnotify talking to
# org.freedesktop.Notifications, and this session has no server on that bus -- so those calls reach
# nothing. That was briefly "fixed" by autostarting mako, and the popups were immediately reported
# as annoying: PosterChan already HAS a notification surface, the taskbar's own centre, and a
# layer-shell daemon drawing a second one over the desktop is exactly the duplicate the migration
# notes forbid ("it must not add a second panel, dock, launcher, notification area").
#
# So the toolbar centre is the surface. Anyone who wants transient popups can install a daemon of
# their choosing; nothing here starts one.

[input]
click_method = default
cursor_speed = 0.0

[decoration]
# THE TITLE BAR IS A SURFACE; THE BORDER IS THE ACCENT; AND WAYFIRE CANNOT DRAW BOTH.
#
# `active_color` fills a decorated window's title bar AND its border in ONE colour. That was tuned
# three times and each value was wrong in its own way: a purple nobody chose ("why the fuck are the
# windows purple?"), the raised surface `--bg2` (a border nobody could see -- "where the fuck is the
# hyprland color around the entire windows"), the raw accent (a bright cyan title bar -- "firefox is
# now a bright cyan window title?"), and finally a 45% blend, #257281, which made every native window
# a teal box that matched neither the desktop nor a PosterChan window ("window color has a different
# color from the rest of the desktop and no border"). Measured on foot in a headless session with
# that config: title and edge one teal, 29,266 pixels of it. And none of it ever reached Firefox,
# which draws its own title bar and is never decorated by Wayfire at all.
#
# So the two jobs are split, the way PosterChan's own windows split them. This section paints the
# title bar the raised-surface colour a PosterChan title bar is drawn on (`--bg2`, and the page
# `--bg` unfocused), and the posterchan-shell plugin draws the accent ring -- its `window_border*`
# options, further down -- around EVERY application window, decorated or not, directly over this
# section's border band. `border_size` here and `window_border_size` there must stay equal, and both
# equal `#pc-oswin-frame`'s 4px; tests/test_window_frame_matches_the_client.py holds all three.
#
# THEY CANNOT FOLLOW THE USER'S CHOSEN THEME TODAY. Themes switch inside the client at runtime; this
# is a compositor config, and rewriting it under a running Wayfire is what killed a live session
# (see pc-compositor-session). These are the DEFAULT theme's tokens, the theme this OS boots into.
border_size = 4
active_color = \#12121aff
inactive_color = \#0a0a0fff
font_color = \#edeefaff
ignore_views = app_id is "posterchan-desktop" | app_id is "PosterChan" | app_id is "place.poster.desktop" | title contains "PosterChan Window"

[move]
activate = <super> BTN_LEFT
# Wayfire performs the final native geometry; PosterChanUI continues to own the preview. Disabling
# timed workspace switching is essential at monitor seams, where a drag must stay on the real output.
enable_snap = true
snap_threshold = 10
quarter_snap_threshold = 50
enable_snap_off = true
snap_off_threshold = 10
workspace_switch_after = -1

[resize]
activate = <super> BTN_RIGHT

[command]
release_binding_start = KEY_LEFTMETA
command_start = /usr/local/bin/pc-super tap
# SUPER+ARROW HAS TO SNAP, NOT MERELY ANNOUNCE ITSELF.
#
# These four bindings existed only to run `pc-super used`, which suppresses the Start menu that the
# Super RELEASE would otherwise open. They never carried the window action, so keyboard snapping --
# Super+Left/Right to half, Super+Up to maximise, Super+Down to minimise -- silently did nothing on
# this session while the same keys worked on the old one. Wayfire runs a command through `sh -c`, so
# each binding does both: mark the modifier consumed, then perform the snap.
binding_super_used_left = <super> KEY_LEFT
command_super_used_left = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-snap left
binding_super_used_right = <super> KEY_RIGHT
command_super_used_right = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-snap right
binding_super_used_up = <super> KEY_UP
command_super_used_up = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-snap max
binding_super_used_down = <super> KEY_DOWN
command_super_used_down = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-snap minimise
# MOVING A WINDOW BETWEEN MONITORS, which this session had no keyboard route for at all.
#
# Sway bound Super+Shift+Left/Right and they were not carried over, so on a two-monitor desk the
# only way to move a window across was to drag it. These go through the helper rather than the
# compositor because a native application has a paired PosterChan frame that a raw move strands
# behind as a black window -- the helper hands those to the renderer and moves the rest itself.
binding_super_used_move_left = <super> <shift> KEY_LEFT
command_super_used_move_left = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-snap move-left
binding_super_used_move_right = <super> <shift> KEY_RIGHT
command_super_used_move_right = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-snap move-right
binding_super_used_move_up = <super> <shift> KEY_UP
command_super_used_move_up = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-snap move-up
binding_super_used_move_down = <super> <shift> KEY_DOWN
command_super_used_move_down = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-snap move-down
# Super+Q is the other close, and it is the one people who came from a tiling session reach for.
# pc-window-close, not pc-wayfire-action, because the same key must close a native application as
# well as a PosterChan window and only the helper can tell them apart.
binding_super_used_close = <super> KEY_Q
command_super_used_close = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-close
# The third close chord the Sway session carried. It is free here (there are no exposed workspaces
# for Super+digit to switch to) and it is the one an upgrade deliberately added to existing configs,
# so dropping it in the move would have quietly taken a shortcut away from anyone using it.
binding_super_used_close_one = <super> KEY_1
command_super_used_close_one = /usr/local/bin/pc-super used; /usr/local/bin/pc-window-close
# BTN_LEFT/RIGHT belong exclusively to the move/resize plugins above. Registering the same chord in
# command consumed the press before move saw it, so Super+drag did nothing and edge snap never ran.
# ALT+TAB, WHICH THIS SESSION SIMPLY DID NOT HAVE.
#
# The helper is installed and the renderer has handled `pc:cycle:*` throughout; only the binding was
# missing, so the key fell through to Wayfire's own switcher (removed above) and cycled between the
# two shell surfaces -- i.e. between "the desktop" and "the desktop", while the window the user
# wanted sat inside one of them.
binding_window_cycle = <alt> KEY_TAB
command_window_cycle = /usr/local/bin/pc-window-cycle next
binding_window_cycle_back = <alt> <shift> KEY_TAB
command_window_cycle_back = /usr/local/bin/pc-window-cycle previous
binding_terminal = <alt> KEY_ENTER
command_terminal = /usr/local/bin/pc-wayfire-action pc:terminal
binding_tasks = <ctrl> <alt> KEY_DELETE
command_tasks = /usr/local/bin/pc-wayfire-action pc:tasks
# THE MEDIA AND BRIGHTNESS KEYS, WHICH THIS SESSION HAD NONE OF.
#
# Sway bound all nine and they were simply not carried over: volume, mute, mic-mute, brightness and
# the three transport keys all did nothing on the Wayfire desktop, on every keyboard that has them.
# They go through pc-key rather than calling wpctl directly because the step sizes, the volume
# ceiling and the brightness backend belong in one place -- and the transport keys reach the shell's
# own player over MPRIS, which is the only thing that can decrypt a track.
#
# Wayfire runs bindings while the session is idle/locked without any equivalent of Sway's
# `--locked`, which is what these need: turning the volume down should not require unlocking.
binding_volume_up = KEY_VOLUMEUP
command_volume_up = /usr/local/bin/pc-key volume-up
binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = /usr/local/bin/pc-key volume-down
binding_volume_mute = KEY_MUTE
command_volume_mute = /usr/local/bin/pc-key mute
binding_mic_mute = KEY_MICMUTE
command_mic_mute = /usr/local/bin/pc-key mic-mute
binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = /usr/local/bin/pc-key brightness-up
binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = /usr/local/bin/pc-key brightness-down
binding_media_play = KEY_PLAYPAUSE
command_media_play = /usr/local/bin/pc-key play-pause
binding_media_next = KEY_NEXTSONG
command_media_next = /usr/local/bin/pc-key next
binding_media_prev = KEY_PREVIOUSSONG
command_media_prev = /usr/local/bin/pc-key previous
binding_screenshot_region = KEY_SYSRQ
command_screenshot_region = /usr/local/bin/pc-screenshot region
# The third screenshot chord, which the Sway session had and this one lost. Print is the key most
# keyboards have for it; Ctrl+Shift+S is the one people who have used any other desktop reach for,
# and a key that does nothing is indistinguishable from the feature being broken.
binding_screenshot_region_alt = <ctrl> <shift> KEY_S
command_screenshot_region_alt = /usr/local/bin/pc-screenshot region
binding_screenshot_screen = <shift> KEY_SYSRQ
command_screenshot_screen = /usr/local/bin/pc-screenshot screen
# ONE CHORD, ONE BINDING. This registered <super><shift>Enter TWICE -- once for the recovery
# terminal and once to mark the modifier consumed -- and only one of two bindings on the same chord
# can win, so either the terminal never opened or Start opened on the release. Chained, like the
# arrow keys above, it does both and is registered once.
binding_recovery_terminal = <super> <shift> KEY_ENTER
command_recovery_terminal = /usr/local/bin/pc-super used; foot
binding_shell_restart = <ctrl> <alt> KEY_BACKSPACE
command_shell_restart = /usr/local/bin/pc-shell-restart
# ALT+F4 CLOSES WHATEVER IS FOCUSED, and that is the whole reason it goes through the helper.
#
# `pc-wayfire-action pc:close` reaches ONE thing: the renderer, which closes its own focused frame.
# With a popped-out PosterChan window focused -- a real toplevel of its own, in another renderer --
# it closed nothing, and the key read as broken. Super+Q already went through pc-window-close, which
# asks the compositor what is focused first; the two close chords must not answer differently.
binding_close = <alt> KEY_F4
command_close = /usr/local/bin/pc-window-close

[idle]
# TEN MINUTES, NOT TWO, AND THE TWO WAS BEING FELT AS THREE DIFFERENT BUGS.
#
# Measured 2026-09-18 from a real machine's wayfire.log, a desktop on a 55" TV over DisplayPort:
#
#   21:53:53  connector DP-5: Turning off
#   21:55:06  connector DP-5: Modesetting with 1920x1080 @ 60.000 Hz   <- somebody touched a key
#   21:57:18  connector DP-5: Turning off                             <- 132s later, again
#
# Reported as three separate faults: "flashing bottom part of screen", "taskbar keeps disappearing"
# and "wifi password screen keeps disappearing". All one cause. A TV re-syncs its link on every wake,
# which is the flashing; the shell repaints after it, which reads as the taskbar going away; and a
# Wayland popup that loses focus across the cycle is simply gone, which is why a password could not be
# typed into it. Two minutes is shorter than reading a dialog, and on a LIVE session it is shorter
# than reading the installer.
#
# pc-idle still owns the policy and Settings -> Power still writes this key (see
# tests/test_pc_idle_status.py, whose docstring calls 120 "the packaged two minutes" -- it fixed the
# setting reaching the compositor and left the default alone). This is only the number a machine
# starts with, which is the number every live session and every fresh install uses.
dpms_timeout = 600
# THERE IS ONLY ONE IDLE POLICY ON THIS MACHINE, AND IT IS pc-idle's.
#
# Wayfire's idle plugin has a SECOND timer: `screensaver_timeout`, 3600s by default, which fades the
# screen to black WITHOUT powering the outputs down. Nothing here ever set it, nothing surfaced it,
# and it silently undercut every setting that did exist -- most sharply the one where somebody has
# said the opposite. Settings -> Power -> "Never", and Keep Awake, both set `dpms_timeout = -1`, and
# the screen still went black an hour later with the monitors awake, the compositor healthy and the
# shell surfaces mapped: nothing to see in any log, and indistinguishable from the desktop crashing.
# Measured: a 28,769-byte screenshot of a 3840x2560 output, restored by one mouse movement.
#
# -1 disables it. `dpms_timeout` is the single control, and pc-idle keeps them in step.
screensaver_timeout = -1
disable_on_fullscreen = true

[window-rules]
# Do not match shell surfaces by app_id here: real PosterChan popouts deliberately share that app_id.
# main.js assigns only the two shell con_ids to full-output geometry through IPC. A blanket maximize
# rule made each popout cover all earlier windows and produced the apparent one-window-only desktop.
#
# THERE IS NO COMPOSITOR RULE FOR GAMES HERE, AND THERE CANNOT BE ONE.
#
# The Sway session carried `for_window [class="^steam_app_.*"] fullscreen enable, inhibit_idle
# fullscreen`. Its port -- `rule_steam_fullscreen = on created if app_id contains "steam_app_" then
# set fullscreen true` -- was a no-op TWICE OVER, and it logged an error rather than acting:
# Wayfire 0.10's window-rules `set` understands exactly five identifiers (sticky, always_on_top,
# alpha, geometry, geometry_ppt), and `fullscreen` takes the else branch, "Unsupported set operation
# to identifier". There is no fullscreen ACTION in that plugin at all -- `strings` on the installed
# libwindow-rules.so lists maximize/minimize/sticky/always_on_top/alpha/geometry and nothing else.
# `contains` is also an UNANCHORED substring test rather than Sway's anchored regex, so it was
# looser than what it replaced as well as inert.
#
# Games are fullscreened over IPC instead (desktop/main.js's enforceNativeGameFullscreen calls
# wm-actions/set-fullscreen), which additionally catches Proton's LATE WM_CLASS -- something a
# map-time rule cannot see. The idle half is covered for every fullscreen window by
# `disable_on_fullscreen` in [idle] above, so nothing is lost by having no rule here.

[posterchan-shell]
# KEEPING THE MOUSE ON THE MONITOR A FULLSCREEN GAME IS USING. OFF BY DEFAULT.
#
# Reported for over a week as "the cursor is leaving the monitor on a full screen game" and "just
# make it work like every other OS". FULLSCREEN IS NOT CONFINEMENT on any wlroots compositor: the
# one protocol mechanism is pointer-constraints-v1 and only the CLIENT can ask for it, so a game
# with mouse-look IS held, and the same game sitting in its own menu -- or running borderless --
# grabs nothing and its pointer walks onto the next monitor.
#
# MEASURED HERE, not assumed (wayfire 0.10.1-r1, wayfire-plugins-extra 0.10.0, wlroots 0.19.2, on
# the laptop with a second headless output and a real uinput pointer):
#   * `grep -l constrain /usr/share/wayfire/metadata/*.xml` returns force-fullscreen and NOTHING
#     else, and `list-methods` over the running IPC returns 45 methods of which none touch the
#     pointer -- so the previous note in this file was right that the shell could not arm it.
#   * force-fullscreen's `constrain_pointer` DOES clamp when Super+Alt+F is pressed: the drag
#     stopped dead at x=1920, the right edge of eDP-1.
#   * AND IT SILENTLY STOPS. It connects and disconnects its motion hook from a FOCUS signal, so
#     the moment focus moved to a transient popup the same drag walked to x=3200 on the neighbour
#     and stayed escapable until the game was clicked again. A game that shows an overlay, a
#     launcher or a notification loses the confinement with nothing to say so. It also rescales the
#     view through a 2D transformer, which is not something to do to a game already at native
#     fullscreen.
#
# So the rule is re-derived on every motion event by our own posterchan-shell plugin -- active
# output, its active view, is that view fullscreen -- with nothing latched that can go stale. It
# never touches the deltas while a client holds its own pointer-constraints-v1 grab (clamping those
# would put an invisible wall in a game's mouse-look, which reads the same delta fields), and it
# confines rather than captures: a pointer already on another monitor is left alone.
#
# The switch is System Settings -> Displays, or `pc-pointer-confine on|off`; both set this option
# live over `wayfire/set-config-options` and persist it per identity.
#
# ON. It shipped off, on the argument that a pointer which cannot leave a monitor is a trap if
# it fires on the wrong window -- and the answer to that is "no other OS makes you fucking
# toggle the cursor guard". The trap is hypothetical and bounded (one key turns it off, and it
# does nothing at all on a single monitor or outside a fullscreen window); the cursor walking
# out of a game onto the second screen mid-aim is what actually happens, on the exact hardware
# this ships to. A default nobody would choose is not a safe default.
#
# THIS LINE IS NOT THE ONLY DEFAULT. [autostart] runs `pc-pointer-confine apply`, which pushes
# the PERSON'S stored answer over the top of whatever this says a moment later -- so the
# helper's own no-file fallback has to agree with this, or the session sets it straight back.
confine_pointer_to_fullscreen = true

# THE ACCENT RING AROUND EVERY APPLICATION WINDOW -- see [decoration] above for why the compositor
# draws it rather than the decoration plugin. The colours are the client's accent at the two
# opacities `#pc-oswin-frame` uses (.92 focused, .38 not), composited over `--bg`, so a native window
# and a PosterChan window beside it wear the same edge.
window_border = true
window_border_size = 4
window_border_active_color = \#38d6ecff
window_border_inactive_color = \#1d5e6aff

[fast-switcher]
# NOT ALT+ESC, WHICH IS THE PLUGIN'S DEFAULT AND WAS "THE CHORD THAT COLLIDES WITH NOTHING".
#
# It collides with cancelling Alt+Tab. Escape is pressed while Alt is still held, so the compositor
# sees Alt+Esc, gives it to fast-switcher and the shell never receives the key: measured on a
# two-output session, the chooser stayed open with focus handed to the next native window, and
# five seconds later the chooser's own safety timer committed to whatever card was selected. So
# pressing Escape to change your mind switched windows twice. Super+Alt+Esc keeps the escape hatch
# and cannot be typed by a hand that is only holding Alt.
activate = <super> <alt> KEY_ESC
activate_backward = <super> <alt> <shift> KEY_ESC

[force-fullscreen]
# THE MANUAL KEY, KEPT. Super+Alt+F stretches the focused window to the whole output and clamps the
# pointer to it -- useful for a window that refuses to fullscreen itself. Its constraint is NOT the
# policy above and cannot be: see the measurement in [posterchan-shell], where it released itself
# on the next focus change.
#
# `preserve_aspect = false` because the view is already the size of the output by the time anyone
# presses this and a preserved-aspect pass would letterbox a game that fits exactly.
constrain_pointer = true
constraint_area = output
preserve_aspect = false
