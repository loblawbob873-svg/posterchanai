# PosterChanOS: libvirt's secret key is made so that it can never be left EMPTY, and an empty one is
# made again. Stock, this unit runs only when the key file is missing, and writes it straight from a
# pipe -- so when `systemd-creds encrypt` produced nothing (every install from an ISO that carried the
# build host's /var/lib/systemd/credential.secret: "comes from a different machine ID, deleting") it
# left a 0-byte key, never ran again, and libvirtd failed every boot with "Failed at step CREDENTIALS
# ... Bad message" -- the VMs app dead on every install. An empty key has encrypted nothing, so making
# a new one loses nothing.
[Unit]
ConditionPathExists=

[Service]
ExecStart=
# systemd expands $VAR itself, even inside the quotes: every $ meant for the shell is written $$.
ExecStart=/usr/bin/sh -c 'k=/var/lib/libvirt/secrets/secrets-encryption-key; [ -s "$$k" ] && exit 0; umask 0077; mkdir -p /var/lib/libvirt/secrets; dd if=/dev/random status=none bs=32 count=1 | systemd-creds encrypt --name=secrets-encryption-key - "$$k.new" && [ -s "$$k.new" ] && mv -f "$$k.new" "$$k"; rc=$$?; rm -f "$$k.new"; exit $$rc'
