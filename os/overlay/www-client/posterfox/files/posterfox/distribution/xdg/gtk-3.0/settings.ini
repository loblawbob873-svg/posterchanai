# PosterFox only (the posterfox launcher puts this folder first in XDG_CONFIG_DIRS): the window buttons PosterChan
# windows have, on the right -- minimise, maximise, close. GTK's built-in default ("menu:close") gives Firefox a
# close button and nothing else. A person's own ~/.config/gtk-3.0/settings.ini still wins.
[Settings]
gtk-decoration-layout=:minimize,maximize,close
gtk-application-prefer-dark-theme=true
