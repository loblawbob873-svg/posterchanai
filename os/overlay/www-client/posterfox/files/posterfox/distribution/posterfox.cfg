// PosterFox autoconfig (the first line of this file is skipped by Firefox, so it is a comment).
//
// Runs once at startup with chrome privileges. It does exactly three things and fails quietly (a broken
// config.json must never stop the browser from starting):
//  1. points Firefox's AI sidebar at THIS computer's PosterChan instance, read from the PosterChan desktop's own
//     ~/.config/posterchan-desktop/config.json ("instance", poster.place when unset, as the desktop reads it);
//  2. loads posterfox-chrome.css, which draws the browser window the way PosterChan windows are drawn;
//  3. (once per profile) moves the bundled add-ons onto the toolbar.
(function () {
  const { classes: Cc, interfaces: Ci } = Components;
  const S = (typeof Services !== "undefined") ? Services
    : ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;

  function readText(file) {
    const fis = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    fis.init(file, 0x01, 0, 0);
    const cis = Cc["@mozilla.org/intl/converter-input-stream;1"].createInstance(Ci.nsIConverterInputStream);
    cis.init(fis, "UTF-8", 0, 0);
    let out = "", chunk = {};
    while (cis.readString(65536, chunk)) out += chunk.value;
    cis.close();
    return out;
  }

  // THE SAME DEFAULT THE DESKTOP USES (desktop/main.js instance()): no "instance" key -- or no config yet -- means
  // https://poster.place, and only an explicit "" means "no server". Reading the key alone left every machine that had
  // never typed an address (the laptop, 2026-10-29: "i don't see any posterchan AI integration?") with Firefox's
  // own chatbot list.
  let inst = "https://poster.place";
  try {
    const f = S.dirsvc.get("Home", Ci.nsIFile);
    for (const part of [".config", "posterchan-desktop", "config.json"]) f.append(part);
    if (f.exists() && f.fileSize < 1048576) {
      const v = (JSON.parse(readText(f)) || {}).instance;
      if (v !== undefined && v !== null) inst = String(v).trim().replace(/\/+$/, "");
    }
  } catch (e) { /* an unreadable config: the desktop's default, as above */ }
  // Only a plain web origin: this string becomes the URL of a privileged-looking sidebar.
  if (/^https?:\/\/[A-Za-z0-9.-]+(:\d{1,5})?$/.test(inst)) {
    defaultPref("browser.ml.chat.provider", inst + "/client?pcai=1");
    defaultPref("browser.ml.chat.hideLocalhost", false);
  }

  // 3. THE ADD-ONS SIT ON THE TOOLBAR ("the extensions should be pinned to the toolbar in posterfox by default", 2026-10-29).
  // policies.json gives each `default_area: navbar`, which Firefox honours only for an add-on it has never placed --
  // a profile that already had them (every machine that ran an earlier PosterFox) keeps them in the puzzle-piece menu.
  // So once per profile, after the first window, each one is moved to the toolbar; `posterfox.toolbar.pinned` records it,
  // and anything somebody unpins afterwards stays where they put it.
  try {
    if (!S.prefs.getBoolPref("posterfox.toolbar.pinned", false)) {
      const WIDGETS = ["ublock0_raymondhill_net-browser-action", "jid1-mnnxcxisbpnsxq_jetpack-browser-action",
                       "passwords_poster_place-browser-action"];
      const pin = () => {
        try {
          const { CustomizableUI } = ChromeUtils.importESModule("resource:///modules/CustomizableUI.sys.mjs");
          for (const id of WIDGETS) {
            const at = CustomizableUI.getPlacementOfWidget(id);
            if (!at || at.area !== CustomizableUI.AREA_NAVBAR) CustomizableUI.addWidgetToArea(id, CustomizableUI.AREA_NAVBAR);
          }
          S.prefs.setBoolPref("posterfox.toolbar.pinned", true);
        } catch (e) { /* the next start tries again */ }
      };
      const seen = (subject, topic) => { S.obs.removeObserver(seen, topic); setTimeout(pin, 3000); };
      S.obs.addObserver(seen, "browser-delayed-startup-finished");
    }
  } catch (e) { /* the browser works with the add-ons in the menu */ }

  try {
    const css = S.dirsvc.get("GreD", Ci.nsIFile);
    css.append("posterchan");
    css.append("posterfox-chrome.css");
    if (css.exists()) {
      const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
      const uri = S.io.newFileURI(css);
      if (!sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
    }
  } catch (e) { /* the browser works without the PosterChan chrome */ }
})();
