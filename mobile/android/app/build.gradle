apply plugin: 'com.android.application'

android {
    namespace "place.poster.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "place.poster.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.hasProperty('versionCode') ? project.getProperty('versionCode').toInteger() : 1
        versionName project.hasProperty('versionName') ? project.getProperty('versionName') : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file("$rootDir/posterchan-release.keystore")
            storePassword "posterchan"
            keyAlias "android"
            keyPassword "posterchan"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // UnifiedPush: the packaged app's ONLY way to be woken. A WebView has no Web Push, so without
    // this the native build cannot receive a call or a message while closed — unlike the web PWA.
    // Not Firebase: an endpoint is a plain HTTPS URL from a distributor the user chose, so nothing
    // Google-owned enters a self-hosted app, and the distributor's single socket is shared by every
    // app on the phone rather than us holding our own.
    // 3.3.3, not 2.x: the 2.x line is not published at these coordinates on Maven Central (or
    // Google, or JitPack) and the build failed to resolve it. 3.x is also a different API — a
    // PushService rather than a MessagingReceiver — so PushEventService follows that shape.
    implementation 'org.unifiedpush.android:connector:3.3.3'
    // The remote signer's WebSocket (see signer/SignerRelayService). Java has no WebSocket client
    // below API 33 and Android never got one at all, so answering NIP-46 natively needs a library —
    // and this is the one Android already ships inside a dozen other SDKs, so it is well-trodden
    // rather than exotic. 4.x is Kotlin-based, which costs nothing here: kotlin-stdlib is already on
    // the classpath through capacitor-android's kotlin-bom.
    //
    // It is used for ONE thing — a WebSocket per relay with a ping interval — not as a general HTTP
    // client. Nothing else in this app routes through it, and it must stay that way: the app's own
    // HTTP goes through the WebView so it inherits the user's proxy and Tor settings, which an OkHttp
    // client would silently bypass.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // MediaSessionCompat + MediaStyle + the media-button receiver — the lock-screen/car transport for
    // the music player (see music/MusicService). androidx.media, NOT media3: media3's session is built
    // around holding a Player, and ours holds nothing — the audio is in the WebView, which is the whole
    // shape of the problem. This is the compat layer for exactly that case, and it is ~200KB.
    implementation "androidx.media:media:1.7.0"
    // Explicit, not transitive: MusicService needs ContextCompat.registerReceiver(…, RECEIVER_*),
    // which is core 1.9+. It arrives anyway via appcompat today — and would vanish the day a
    // dependency bump resolved core lower, as a compile error in a file nothing else touches.
    implementation "androidx.core:core:$androidxCoreVersion"
    // Folder sync's background change check — the OS holds the job until the phone is charging
    // on Wi-Fi, which is the whole battery story.
    implementation "androidx.work:work-runtime:2.9.1"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Screen sharing: MediaProjection → H264/AAC → RTMP (Android WebView has no getDisplayMedia, so the
    // screen can't reach WebRTC/WHIP at all — we push to the same MediaMTX ingest OBS uses instead).
    // PINNED to 2.7.2 ON PURPOSE: 2.7.3+ sets minCompileSdk=36 in its aar-metadata and will not configure
    // against compileSdk 35. The API we use is identical in 2.7.2. (2.7.2 is itself built with Kotlin
    // 2.3, which is why the AGP bump in the root build.gradle was needed to keep even this pin working —
    // pinning the dependency down was never going to hold on its own.)
    implementation "com.github.pedroSG94.RootEncoder:library:2.7.2"
    // A NATIVE QR decoder (see scan/QrScanPlugin). The in-app scanner is jsQR on a downscaled canvas
    // frame and is MEASURED to fail on a primal.net-shaped code below ~40% frame fill
    // (scripts/check_qr_scan.py), while the same phone's own camera app reads it every time. This is
    // the difference, and it is not one we can tune our way out of from inside a WebView.
    // zxing-android-embedded rather than ML Kit precisely because it needs NOTHING from Play
    // Services: it bundles the decoder and its own capture Activity, so a de-Googled phone gets the
    // same scanner as everyone else. ~500KB.
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    // libsecp256k1, the reason Amber signs faster than we did (see signer/Native.java). MEASURED:
    // the pure-Java signer is 36ms per Schnorr signature on a warmed DESKTOP core, and a NIP-46
    // request needs two of them plus two ECDH; the C implementation is ~50 MICROseconds. It is
    // reached by REFLECTION, never imported, so that Nostr/Crypt still compile and RUN under plain
    // javac in tests/test_android_nip55_signer.py — the cross-check against the repo's own Python
    // implementation is worth more than the tidiness — and so that a missing library or an ABI with
    // no .so degrades to the Java path instead of failing to start.
    implementation "fr.acinq.secp256k1:secp256k1-kmp-jni-android:0.15.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // INSTRUMENTED TESTS, which as of the emulator workflow actually RUN. ActivityScenario (core)
    // is how the launcher, the dialer and the SMS screens are started on a real device — they live
    // behind system roles and providers (RoleManager, Telephony.Sms, CallLog, InCallService) that do
    // not exist off one, so a javac test cannot reach them and a text-matching test proves nothing.
    // Declared EXPLICITLY rather than relied on transitively through ext:junit: the day a version
    // bump resolves it lower, the whole device suite stops compiling in a file nothing else touches.
    androidTestImplementation "androidx.test:core:1.5.0"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
