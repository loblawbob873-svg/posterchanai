# Nginx configuration for Posterchanai with CalDAV/CardDAV/WebDAV support
# Place this in /etc/nginx/sites-available/posterchanai.conf
# Then: sudo ln -s /etc/nginx/sites-available/posterchanai.conf /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx

upstream web {
    server 127.0.0.1:3051;
}

upstream caldav {
    server 127.0.0.1:8081;
}

upstream carddav {
    server 127.0.0.1:8082;
}

upstream webdav {
    server 127.0.0.1:8080;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name ai.poster.place;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name ai.poster.place;
    
    # SSL certificates (update paths as needed)
    ssl_certificate /etc/letsencrypt/live/ai.poster.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.poster.place/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # HSTS (optional - comment out if testing)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # General settings
    client_max_body_size 100M;
    
    # CalDAV server proxy (primary path)
    location /caldav/ {
        proxy_pass http://caldav/caldav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CalDAV specific headers
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header If $http_if;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    # CalDAV server proxy (legacy /calendar/dav/ path for some clients like iPhone)
    location /calendar/dav/ {
        proxy_pass http://caldav/caldav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CalDAV specific headers
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header If $http_if;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    # CardDAV server proxy
    location /carddav/ {
        proxy_pass http://carddav/carddav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CardDAV specific headers
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header If $http_if;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    # WebDAV server proxy (for file access via /{username}/)
    # Note: This catches paths like /username/ but not /api/, /static/, etc.
    # Adjust the regex as needed for your setup
    location ~ ^/[a-zA-Z0-9._@-]+/?(.*)$ {
        # Only proxy if it looks like a username path (not starting with known prefixes)
        set $skip 0;
        if ($uri ~* "^/(api|static|caldav|carddav|admin|favicon|manifest|sw\.js|\.well-known)") {
            set $skip 1;
        }
        if ($skip = 0) {
            proxy_pass http://webdav;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Depth $http_depth;
            proxy_set_header Destination $http_destination;
            proxy_pass_request_headers on;
            proxy_buffering off;
        }
        if ($skip = 1) {
            # Pass to main app
            proxy_pass http://web;
        }
    }

    # Main application (must be last)
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        client_max_body_size 0;
    }
}
