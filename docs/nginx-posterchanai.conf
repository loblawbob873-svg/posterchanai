# Nginx configuration for Posterchanai with CalDAV/CardDAV/WebDAV support
# Place this in /etc/nginx/sites-available/posterchanai.conf
# Then: sudo ln -s /etc/nginx/sites-available/posterchanai.conf /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx

# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream web {
    server 127.0.0.1:3051;
}

upstream caldav {
    server 127.0.0.1:8081;
}

upstream carddav {
    server 127.0.0.1:8083;
}

# WebDAV is now integrated into FastAPI on port 443, no separate upstream needed
# upstream webdav {
#     server 127.0.0.1:8080;
# }

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name ai.poster.place 192.168.0.1;
    return 301 https://$host$request_uri;
}

