# Main HTTPS server
server {
    listen 443 ssl;
    server_name ai.poster.place 192.168.0.1;
    
    # SSL certificates (update paths as needed)
    ssl_certificate /etc/letsencrypt/live/ai.poster.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.poster.place/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # HSTS (optional - comment out if testing)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # General settings
    client_max_body_size 100M;
    
    # CardDAV discovery endpoint (.well-known)
    location /.well-known/carddav {
        proxy_pass http://carddav/.well-known/carddav;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }
    
    # CalDAV discovery endpoint (.well-known)
    location /.well-known/caldav {
        proxy_pass http://caldav/.well-known/caldav;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }
    
    # CalDAV server proxy (primary path)
    location /caldav/ {
        proxy_pass http://caldav/caldav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Authorization header explicitly
        proxy_set_header Authorization $http_authorization;
        # CalDAV specific headers
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header If $http_if;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    # CalDAV server proxy (legacy /calendar/dav/ path for some clients like iPhone)
    location /calendar/dav/ {
        proxy_pass http://caldav/caldav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # CalDAV specific headers
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header If $http_if;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    # CardDAV server proxy
    location /carddav/ {
        proxy_pass http://carddav/carddav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Authorization header explicitly
        proxy_set_header Authorization $http_authorization;
        # CardDAV specific headers
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header If $http_if;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    # Static files - must come before WebDAV location
    location ^~ /static/ {
        proxy_pass http://web/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Known application paths - must come before WebDAV location
    location ~ ^/(login|admin|sw\.js|manifest\.json|verify) {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    # WebDAV direct access - must come before WebDAV regex location
    location /webdav/ {
        proxy_pass http://web/webdav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    # API endpoints (including WebSocket) - must come before WebDAV location
    location ^~ /api/ {
        proxy_pass http://web/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebDAV server proxy (for file access via /{username}/)
    # WebDAV is now mounted directly in FastAPI at /webdav/, so we proxy username paths there
    # Note: This regex will NOT match /api/, /static/, /login etc. because prefix locations come before it
    location ~ ^/([a-zA-Z0-9._@-]+)/?(.*)$ {
        # Proxy to /webdav/{username}/... where WebDAV is mounted in FastAPI
        rewrite ^/([a-zA-Z0-9._@-]+)/?(.*)$ /webdav/$1/$2 break;
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    # Main application (must be last)
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_redirect off;
        # WebSocket support - use conditional Connection header
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        client_max_body_size 0;
    }
}
