# Zapstore (https://zapstore.dev) — the Nostr-native app store.
#
# Publishing is AUTOMATED: every APK built by .github/workflows/android.yml is published from that same job,
# so a Zapstore release ships with every APK build. Nothing to run by hand.
#
# `pubkey` is load-bearing twice over:
#   - it MUST match the key in the CI secret SIGN_WITH, or `zsp` refuses to publish;
#   - the Zapstore relay fetches THIS file from the repo to confirm the app really belongs to that npub,
#     which is what gets the developer whitelisted. So it has to stay committed.
name: PosterChan
