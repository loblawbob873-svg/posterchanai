# The APK the workflow just built and signed (the job copies it here before publishing).
release_source: ./posterchan.apk

summary: Nostr client with AI chat, image/music/video generation and live streaming
description: |
  PosterChan is the Android client for a self-hosted PosterChanAI instance — a Nostr social client with a
  built-in AI assistant.

  - **Nostr social**: feeds, threads, profiles, DMs, communities and a web-of-trust relay.
  - **AI chat**: streaming LLM chat, with image, music and video generation.
  - **Live streaming**: go live from your camera or share your screen (NIP-53), and watch other people's streams.
  - **Voice and video calls**: 1:1 and group calls over WebRTC.
  - **Self-hostable**: point the app at your own instance — the default is poster.place.

