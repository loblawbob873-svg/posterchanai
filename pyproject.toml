[project]
name = "posterchanai"
version = "1.0.0"
description = "Native AI backend with LLM and image generation APIs"
requires-python = ">=3.10"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = "venv"
include = ["app/**/*.py", "scripts/**/*.py"]
exclude = ["venv", "__pycache__"]
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
# Runtime data may contain arbitrary Git checkouts whose packages are also named `app`. Collecting
# those as PosterChan tests shadows this repository's own package and turns a healthy release gate
# into dozens of misleading import failures. Keep the default gate on the owned test tree; explicit
# paths can still run a diagnostic script when needed.
testpaths = ["tests"]
norecursedirs = ["data", ".git", ".venv", "venv", "venv-unified", "node_modules"]
# pytest's own tmp_path trees stay at the SHORT system path (see scripts/private_tmp.py: a longer one
# pushes Unix socket paths past 108 bytes). Only the latest run's tree is ever kept, and a run that
# PASSED deletes its own at the end (tests/conftest.py pytest_sessionfinish). Not the "failed"
# retention policy: that deletes each passed test's directory as it finishes, so the next
# parametrized case is handed the SAME path -- and tests/test_vmhost_integration.py's per-path
# journal lock then refused it ("another migrator is still running on this migration journal").
tmp_path_retention_count = 1
